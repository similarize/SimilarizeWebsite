<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Drop Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #101114;
      --surface: #1b1d24;
      --surface-2: #262932;
      --fg: #f4efe6;
      --muted: #9c968b;
      --accent: #e4a23a;
      --line: #353842;
      --sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 48%, color-mix(in srgb, var(--bg) 55%, transparent) 100%);
    }
    #back {
      position: absolute; top: max(8px, env(safe-area-inset-top)); right: 10px; z-index: 5;
      color: #fff; font: 700 14px var(--sans); text-decoration: none;
      border: 2px solid rgba(255,255,255,.55); border-radius: 999px;
      padding: 8px 14px; background: rgba(0,0,0,.55);
    }
    .chrome {
      position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
      justify-content: space-between; gap: 12px; padding: 12px; pointer-events: none;
    }
    .card {
      pointer-events: auto; width: max-content; max-width: calc(100% - 120px);
      border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 90%, transparent);
      border-radius: 16px; padding: 12px 16px; backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgb(0 0 0 / 0.38);
    }
    .kicker { margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-family: var(--display); font-weight: 560; font-size: 32px; line-height: 1; letter-spacing: -0.02em; }
    #count { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .dock {
      pointer-events: auto; width: min(560px, 100%); margin: 0 auto;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 90%, transparent);
      border-radius: 16px; padding: 12px; backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgb(0 0 0 / 0.38);
    }
    .tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    button {
      height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
      color: var(--fg); font: 500 12px var(--sans); cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    #clear { color: var(--muted); }
    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    label span { display: flex; justify-content: space-between; }
    label b { color: var(--fg); font-weight: 500; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
    #boot {
      position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
      background: var(--bg); color: var(--muted); font-size: 14px;
    }
    #boot[hidden] { display: none !important; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 640px) {
      .sliders { gap: 10px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="vignette"></div>
  <a id="back" class="exit-arcade" href="/games/">← Arcade</a>
  <div id="boot">Warming the workshop…</div>
  <div class="chrome">
    <header class="card">
      <p class="kicker">Workshop</p>
      <h1>Drop Lab</h1>
      <p id="count">0 / 48 shapes</p>
    </header>
    <div class="dock">
      <div class="tools">
        <button type="button" data-spawn="sphere">Sphere</button>
        <button type="button" data-spawn="box">Box</button>
        <button type="button" data-spawn="cylinder">Cylinder</button>
        <button type="button" id="pile">Pile</button>
        <button type="button" id="clear">Clear</button>
      </div>
      <div class="sliders">
        <label>
          <span>Gravity <b id="gravity-out">9.8</b></span>
          <input id="gravity" type="range" min="0" max="25" step="0.1" value="9.8" aria-label="Gravity" />
        </label>
        <label>
          <span>Bounce <b id="bounce-out">0.32</b></span>
          <input id="bounce" type="range" min="0" max="0.92" step="0.01" value="0.32" aria-label="Bounce" />
        </label>
      </div>
      <p class="hint">Drag a shape to throw it. Drag the floor to look around. Scroll to zoom. 1 2 3 4 C</p>
    </div>
  </div>
  <script src="../shared/sfx.js?v=20261008-audio1"></script>
  <script type="module" src="./app.js?v=20261008-audio1"></script>
</body>
</html>
