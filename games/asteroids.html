<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Asteroids</title>
  <link rel="stylesheet" href="asteroids.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <a id="back" href="/games/">Games</a>
  <div id="controls">
    <button type="button" id="left" aria-label="Turn left">◀</button>
    <button type="button" id="right" aria-label="Turn right">▶</button>
    <button type="button" id="thrust" aria-label="Thrust">▲</button>
    <button type="button" id="shoot" aria-label="Fire">●</button>
  </div>
  <div id="overlay">
    <h1 id="overlay-title">Asteroids</h1>
    <p id="overlay-text"></p>
    <p class="go">Tap, click, or press space</p>
  </div>
  <script src="asteroids.js"></script>
</body>
</html>
