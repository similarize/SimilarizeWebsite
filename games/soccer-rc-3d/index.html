<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Soccer RC 3D</title>
  <!-- Cache-bust: ?v=20261006-soccerrc3d6 — 2-thumb only: stick | 2x2 FWD/KICK/REV/BST -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=20261006-soccerrc3d6" />
  <script src="/games/shared/tesla-fullscreen.js?v=tfs1"></script>
  <script src="/games/shared/viewport-fill.js?v=vfs1"></script>
  <script src="/games/shared/gamepad.js?v=20261006-soccerrc3d6"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="top">
    <a class="exit-arcade" href="/games/">← Arcade</a>
    <span class="scores"><span class="o">P1 <span id="s1">0</span></span> · <span class="b">P2 <span id="s2">0</span></span></span>
    <span class="hint">P1 arrows + Space kick · Shift boost · P2 WASD + Q kick · E boost · R reset · Pad: RT/LT drive · stick steer · A kick · B boost</span>
    <button type="button" id="resetBtn">Reset</button>
    <button type="button" id="musicBtn" aria-pressed="false" title="Toggle background music">Music off</button>
    <span class="online" id="onlineBar">
      <button type="button" id="createRoomBtn">Create</button>
      <input id="roomCodeInput" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code" />
      <button type="button" id="joinRoomBtn">Join</button>
      <button type="button" id="leaveRoomBtn" hidden>Leave</button>
      <span class="status" id="onlineStatus"></span>
    </span>
  </div>
  <div id="banner" aria-live="polite"></div>
  <div class="boost-row">
    <div class="boost-card p1">
      <label>Orange boost</label>
      <div class="meter" aria-hidden="true"><i id="boost1"></i></div>
    </div>
    <div class="boost-card p2">
      <label>Blue boost</label>
      <div class="meter" aria-hidden="true"><i id="boost2"></i></div>
    </div>
  </div>
  <!-- TWO THUMBS ONLY (landscape-first):
       P1: left thumb = stick (pivot); right thumb = 2×2 FWD|KICK / REV|BST
       P2: mirrored on right half — each local player uses both thumbs on their half -->
  <div class="pads" id="pads">
    <div class="cluster p1" data-p="0">
      <span class="cluster-label">ORANGE</span>
      <div class="thumbs">
        <div class="thumb-steer stick-wrap" data-role="steer" data-p="0" aria-label="P1 steer">
          <div class="stick-base">
            <span class="stick-ring" aria-hidden="true"></span>
            <span class="stick-knob" aria-hidden="true"></span>
          </div>
        </div>
        <div class="thumb-actions" role="group" aria-label="P1 drive kick boost">
          <button type="button" class="pad-btn fwd" data-p="0" data-act="fwd" aria-label="P1 forward">FWD</button>
          <button type="button" class="pad-btn kick" data-p="0" data-act="kick" aria-label="P1 kick">KICK</button>
          <button type="button" class="pad-btn rev" data-p="0" data-act="rev" aria-label="P1 reverse">REV</button>
          <button type="button" class="pad-btn boost" data-p="0" data-act="boost" aria-label="P1 boost">BST</button>
        </div>
      </div>
    </div>
    <div class="cluster p2" data-p="1">
      <span class="cluster-label">BLUE</span>
      <div class="thumbs mirror">
        <div class="thumb-actions" role="group" aria-label="P2 drive kick boost">
          <button type="button" class="pad-btn fwd" data-p="1" data-act="fwd" aria-label="P2 forward">FWD</button>
          <button type="button" class="pad-btn kick" data-p="1" data-act="kick" aria-label="P2 kick">KICK</button>
          <button type="button" class="pad-btn rev" data-p="1" data-act="rev" aria-label="P2 reverse">REV</button>
          <button type="button" class="pad-btn boost" data-p="1" data-act="boost" aria-label="P2 boost">BST</button>
        </div>
        <div class="thumb-steer stick-wrap" data-role="steer" data-p="1" aria-label="P2 steer">
          <div class="stick-base">
            <span class="stick-ring" aria-hidden="true"></span>
            <span class="stick-knob" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="boot">Loading Soccer RC 3D…</div>
  <script type="module" src="./game.js?v=20261006-soccerrc3d6"></script>
</body>
</html>
