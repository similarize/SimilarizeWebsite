<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Soccer RC</title>
    <!-- Soccer RC (was Basketball RC). Paths stay basketball.html. Cache-bust: ?v=vfs1 -->
    <!-- Tesla Cybertruck chromeless FS — see games/shared/TESLA_FULLSCREEN.md -->
    <script src="shared/tesla-fullscreen.js?v=tfs1"></script>
    <script src="shared/viewport-fill.js?v=vfs1"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            max-height: 100dvh;
            background: #071207;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            position: relative;
            height: 100svh;
            height: 100dvh;
            max-height: 100dvh;
        }
        /* Play area = full viewport; chrome overlays (does not shrink canvas). */
        .stage {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #228B22;
            touch-action: none;
        }
        .top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
            background: rgba(7, 18, 7, 0.82);
            color: #fff;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
        .top a, .top button, .top .online, .top input {
            pointer-events: auto;
        }
        .top a, .top button {
            color: #fff;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 999px;
            padding: 6px 12px;
            font: inherit;
            text-decoration: none;
        }
        .scores { font-weight: 700; letter-spacing: 0.02em; }
        .scores b.o { color: #fb923c; }
        .scores b.b { color: #60a5fa; }
        .hint {
            margin-left: auto;
            opacity: 0.8;
            font-size: 12px;
            pointer-events: none;
        }
        .pads {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 8px;
            min-width: 0;
            padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            background: rgba(7, 18, 7, 0.72);
            pointer-events: none;
        }
        .pads .cluster { pointer-events: auto; }
        .cluster { display: grid; grid-template-columns: 54px 54px 54px 62px; grid-template-rows: 22px 54px 54px; gap: 6px; min-width: 0; }
        .cluster.p2 { grid-template-columns: 62px 54px 54px 54px; }
        .cluster span { grid-column: 1 / -1; font: 700 12px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.08em; text-align: center; }
        .cluster.p1 span { color: #fb923c; }
        .cluster.p2 span { color: #60a5fa; }
        .cluster button {
            width: 54px;
            height: 54px;
            padding: 0;
            box-sizing: border-box;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.55);
            background: rgba(0,0,0,.38);
            color: #fff;
            font-size: 18px;
            touch-action: none;
        }
        .cluster button.fire { width: 62px; border-radius: 18px; font-size: 13px; font-weight: 700; height: auto; }
        .cluster.p1 button.fire { grid-column: 4; grid-row: 2 / span 2; background: rgba(234, 88, 12, .55); }
        .cluster.p2 button.fire { grid-column: 1; grid-row: 2 / span 2; background: rgba(37, 99, 235, .55); }
        .cluster.p1 button.up { grid-column: 2; grid-row: 2; }
        .cluster.p1 button.left { grid-column: 1; grid-row: 3; }
        .cluster.p1 button.down { grid-column: 2; grid-row: 3; }
        .cluster.p1 button.right { grid-column: 3; grid-row: 3; }
        .cluster.p2 button.up { grid-column: 3; grid-row: 2; }
        .cluster.p2 button.left { grid-column: 2; grid-row: 3; }
        .cluster.p2 button.down { grid-column: 3; grid-row: 3; }
        .cluster.p2 button.right { grid-column: 4; grid-row: 3; }
        @media (max-width: 900px) {
            .hint { display: none; }
            .top { font-size: 13px; gap: 6px; }
            .pads { gap: 8px; padding-top: 4px; }
            .cluster, .cluster.p2 {
                box-sizing: border-box;
                width: calc(50% - 4px);
                max-width: 236px;
                aspect-ratio: 1 / 1.12;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: 16px repeat(3, minmax(0, 1fr));
                gap: 5px;
            }
            .cluster span { grid-row: 1; align-self: center; }
            .cluster button {
                width: 100%;
                height: 100%;
                min-width: 0;
                min-height: 0;
                font-size: clamp(20px, 6vw, 30px);
                font-weight: 800;
                border: 2px solid #fff;
                box-shadow: 0 2px 0 rgba(0,0,0,.5);
            }
            .cluster.p1 button { background: #c2410c; }
            .cluster.p2 button { background: #1d4ed8; }
            .cluster.p1 button.up, .cluster.p2 button.up { grid-column: 2; grid-row: 2; }
            .cluster.p1 button.left, .cluster.p2 button.left { grid-column: 1; grid-row: 3; }
            .cluster.p1 button.down, .cluster.p2 button.down { grid-column: 2; grid-row: 4; }
            .cluster.p1 button.right, .cluster.p2 button.right { grid-column: 3; grid-row: 3; }
            .cluster.p1 button.fire, .cluster.p2 button.fire {
                grid-column: 2;
                grid-row: 3;
                width: 100%;
                height: 100%;
                min-height: 0;
                border-radius: 14px;
                font-size: clamp(12px, 3.4vw, 16px);
                letter-spacing: 0.04em;
            }
            .cluster.p1 button.fire { background: #fdba74; color: #431407; }
            .cluster.p2 button.fire { background: #bfdbfe; color: #1e3a8a; }
        }
        @media (min-width: 1100px) and (pointer: fine) {
            /* Keyboard/desktop: don't cover the playfield with virtual pads */
            .pads { display: none; }
        }

        .online {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .online input {
            width: 4.6em; text-transform: uppercase; letter-spacing: 0.12em;
            font: 700 14px "Segoe UI", system-ui, sans-serif;
            text-align: center; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.35);
            background: rgba(0,0,0,.45); color: #fff; padding: 6px 10px;
        }
        .online .status { font-size: 12px; opacity: 0.85; min-height: 1em; }
        .online .status.err { color: #fca5a5; }
        .online .status.ok { color: #86efac; }
        .pads.solo-p1 { justify-content: center; }
        .pads.solo-p1 .cluster.p2 { display: none; }
        .pads.solo-p2 { justify-content: center; }
        .pads.solo-p2 .cluster.p1 { display: none; }
        .pads.solo-p1 .cluster.p1,
        .pads.solo-p2 .cluster.p2 {
            width: min(280px, 70vw);
            max-width: 280px;
        }
    </style>
</head>
<body>
    <div class="top">
        <a href="/games/">Games</a>
        <span class="scores"><b class="o">P1 <span id="s1">0</span></b> · <b class="b">P2 <span id="s2">0</span></b></span>
        <span class="hint">P1 arrows + space · P2 WASD + Q · R resets · Pad: RT fwd · LT back · stick steer · A kick</span>
        <button type="button" id="soundBtn">Sound on</button>
        <button type="button" id="resetBtn">Reset ball</button>

        <span class="online" id="onlineBar">
            <button type="button" id="createRoomBtn">Create</button>
            <input id="roomCodeInput" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code">
            <button type="button" id="joinRoomBtn">Join</button>
            <button type="button" id="leaveRoomBtn" hidden>Leave</button>
            <span class="status" id="onlineStatus"></span>
        </span>
    </div>
    <div class="stage"><canvas id="gameCanvas" width="800" height="600"></canvas></div>
    <div class="pads">
        <div class="cluster p1">
            <span>ORANGE</span>
            <button type="button" class="up" data-key="ArrowUp" aria-label="P1 forward">▲</button>
            <button type="button" class="left" data-key="ArrowLeft" aria-label="P1 left">◀</button>
            <button type="button" class="down" data-key="ArrowDown" aria-label="P1 back">▼</button>
            <button type="button" class="right" data-key="ArrowRight" aria-label="P1 right">▶</button>
            <button type="button" class="fire" data-fire="1">KICK</button>
        </div>
        <div class="cluster p2">
            <span>BLUE</span>
            <button type="button" class="up" data-key="w" aria-label="P2 forward">▲</button>
            <button type="button" class="left" data-key="a" aria-label="P2 left">◀</button>
            <button type="button" class="down" data-key="s" aria-label="P2 back">▼</button>
            <button type="button" class="right" data-key="d" aria-label="P2 right">▶</button>
            <button type="button" class="fire" data-fire="2">KICK</button>
        </div>
    </div>
    <script src="shared/gamepad.js?v=gp1"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let viewW = 800, viewH = 600, S = 1;
        let projectileSpeed = 5;
        let specks = [];
        const soundOn = { fx: true, music: true, fxVol: 0.25, musicVol: 0.18 };

        // Player 1 RC car (orange)
        const car1 = {
            x: viewW / 4,
            y: viewH / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false,
            score: 0,
            wasDriving: false,
            wasReverse: false,
            isDestroyed: false,
            onConveyor: false,
            isStuckInGoal: false
        };

        // Player 2 RC car (blue)
        const car2 = {
            x: 3 * viewW / 4,
            y: viewH / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false,
            score: 0,
            wasDriving: false,
            wasReverse: false,
            isDestroyed: false,
            onConveyor: false,
            isStuckInGoal: false
        };

        // Basketball object
        const basketball = {
            x: viewW / 2,
            y: viewH / 2,
            radius: 20,
            dx: 0,
            dy: 0,
            friction: 0.98,
            isStuck: false
        };

        // Player 1's hoop (left side)
        const hoop1 = {
            x: viewW / 4,
            y: 100,
            width: 80,
            height: 10,
            rimThickness: 5,
            netHeight: 40
        };

        // Player 2's hoop (right side)
        const hoop2 = {
            x: 3 * viewW / 4,
            y: 100,
            width: 80,
            height: 10,
            rimThickness: 5,
            netHeight: 40
        };

        // Metal barrier
        const barrier = {
            x: 0,
            y: 0,
            width: viewW,
            height: 20
        };

        // Conveyor belt
        const conveyor = {
            x: 0,
            y: viewH - 40,
            width: viewW,
            height: 40,
            speed: 2
        };

        // Game variables
        let projectiles = [];
        let tracks = [];
        const ROTATION_SPEED = 0.1;
        const TRACK_LIFE = 120;

        let backgroundOscillator1 = null;
        let backgroundOscillator2 = null;
        let musicGainNode = null;

        function playSound(frequency, duration, type = 'sine', baseVolume = 0.3) {
            if (!soundOn.fx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = baseVolume * soundOn.fxVol;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function startBackgroundMusic() {
            if (!soundOn.music || backgroundOscillator1) return;
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00];
            const harmonicNotes = notes.map(note => note * 2);
            let noteIndex = 0;

            backgroundOscillator1 = audioCtx.createOscillator();
            backgroundOscillator2 = audioCtx.createOscillator();
            musicGainNode = audioCtx.createGain();

            backgroundOscillator1.connect(musicGainNode);
            backgroundOscillator2.connect(musicGainNode);
            musicGainNode.connect(audioCtx.destination);

            backgroundOscillator1.type = 'triangle';
            backgroundOscillator2.type = 'triangle';
            backgroundOscillator1.frequency.value = notes[noteIndex];
            backgroundOscillator2.frequency.value = harmonicNotes[noteIndex];
            musicGainNode.gain.value = soundOn.musicVol;

            backgroundOscillator1.start();
            backgroundOscillator2.start();

            setInterval(() => {
                if (soundOn.music && backgroundOscillator1) {
                    noteIndex = (noteIndex + 1) % notes.length;
                    backgroundOscillator1.frequency.value = notes[noteIndex];
                    backgroundOscillator2.frequency.value = harmonicNotes[noteIndex];
                }
            }, 500);
        }

        function stopBackgroundMusic() {
            if (backgroundOscillator1) {
                backgroundOscillator1.stop();
                backgroundOscillator2.stop();
                backgroundOscillator1 = null;
                backgroundOscillator2 = null;
                musicGainNode = null;
            }
        }

        document.getElementById('soundBtn').addEventListener('click', () => {
            soundOn.fx = !soundOn.fx;
            soundOn.music = soundOn.fx;
            document.getElementById('soundBtn').textContent = soundOn.fx ? 'Sound on' : 'Sound off';
            if (soundOn.music) startBackgroundMusic();
            else stopBackgroundMusic();
        });
        document.getElementById('resetBtn').addEventListener('click', () => { resetBasketball(); if (netRole === 'host') netSend({ type: 'reset' }); });

        document.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); startBackgroundMusic(); }, { once: true });

        // Reset basketball function
        function resetBasketball() {
            basketball.x = viewW / 2;
            basketball.y = viewH / 2;
            basketball.dx = 0;
            basketball.dy = 0;
            basketball.isStuck = false;
            playSound(700, 0.2, 'sine', 0.2);
        }

        // Respawn car function
        function respawnCar(car) {
            car.x = car === car1 ? viewW / 4 : 3 * viewW / 4;
            car.y = viewH / 2;
            car.angle = 0;
            car.speed = 0;
            car.rotation = 0;
            car.isDestroyed = false;
            car.onConveyor = false;
            car.isStuckInGoal = false;
            playSound(800, 0.3, 'sine', 0.2);
        }

        // Controls for both players
        const keys = {};

        // --- Online two-phone multiplayer (CF Worker + Durable Object rooms) ---
        // Change this after redeploying the Worker.
        const ROOM_WS_BASE = 'wss://similarize-bball-rooms.ben-e22.workers.dev/ws';
        const ROOM_HTTP_BASE = 'https://similarize-bball-rooms.ben-e22.workers.dev';
        let netRole = null; // null | 'host' | 'guest'
        let netWs = null;
        let netCode = '';
        let netReady = false;
        let netRemoteInput = { u:0, d:0, l:0, r:0, fire:0 };
        let netFireArmed = false;
        let lastStateSent = 0;
        let guestPendingState = null;
        let guestInputTimer = 0;
        let netLeaveIntent = false;
        const onlineStatus = document.getElementById('onlineStatus');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const padsEl = document.querySelector('.pads');

        function setOnlineStatus(msg, kind) {
            onlineStatus.textContent = msg || '';
            onlineStatus.className = 'status' + (kind ? ' ' + kind : '');
        }

        function applyPadMode() {
            padsEl.classList.remove('solo-p1', 'solo-p2');
            if (netRole === 'host') padsEl.classList.add('solo-p1');
            else if (netRole === 'guest') padsEl.classList.add('solo-p2');
        }

        function packCar(c) {
            let f = 0;
            if (c.isDestroyed) f |= 1;
            if (c.onConveyor) f |= 2;
            if (c.isStuckInGoal) f |= 4;
            return [round4(c.x), round4(c.y), round4(c.angle), round4(c.speed), f, c.score|0];
        }
        function unpackCar(c, a) {
            c.x = a[0]; c.y = a[1]; c.angle = a[2]; c.speed = a[3];
            c.isDestroyed = !!(a[4] & 1);
            c.onConveyor = !!(a[4] & 2);
            c.isStuckInGoal = !!(a[4] & 4);
            c.score = a[5]|0;
            c.rotation = 0;
        }
        function round4(n) { return Math.round(n * 1000) / 1000; }

        function buildStateMsg() {
            return {
                type: 'state',
                c1: packCar(car1),
                c2: packCar(car2),
                b: [round4(basketball.x), round4(basketball.y), round4(basketball.dx), round4(basketball.dy), basketball.isStuck ? 1 : 0],
                p: projectiles.slice(0, 12).map(p => [round4(p.x), round4(p.y), round4(p.radius), p.owner === car1 ? 1 : 2]),
                vw: viewW, vh: viewH
            };
        }

        function applyStateMsg(msg) {
            if (!msg || !msg.c1) return;
            // Scale if host court size differs slightly
            const sx = msg.vw ? viewW / msg.vw : 1;
            const sy = msg.vh ? viewH / msg.vh : 1;
            unpackCar(car1, msg.c1);
            unpackCar(car2, msg.c2);
            car1.x *= sx; car1.y *= sy;
            car2.x *= sx; car2.y *= sy;
            basketball.x = msg.b[0] * sx;
            basketball.y = msg.b[1] * sy;
            basketball.dx = msg.b[2] * sx;
            basketball.dy = msg.b[3] * sy;
            basketball.isStuck = !!msg.b[4];
            projectiles = (msg.p || []).map(p => ({
                x: p[0] * sx, y: p[1] * sy, radius: p[2] * ((sx+sy)/2),
                dx: 0, dy: 0, life: 30, owner: p[3] === 1 ? car1 : car2
            }));
            document.getElementById('s1').textContent = car1.score;
            document.getElementById('s2').textContent = car2.score;
        }

        function netSend(obj) {
            if (netWs && netWs.readyState === 1) netWs.send(JSON.stringify(obj));
        }

        function readLocalGuestBits() {
            // Guest pad0 uses same RT/LT + stick-while-thrust map (from refreshGamepads).
            const d = padDrive(_gp0);
            return {
                type: 'input',
                u: (keys['w'] || keys['W'] || keys['ArrowUp'] || d.fwd) ? 1 : 0,
                d: (keys['s'] || keys['S'] || keys['ArrowDown'] || d.rev) ? 1 : 0,
                l: (keys['a'] || keys['A'] || keys['ArrowLeft'] || d.steerL) ? 1 : 0,
                r: (keys['d'] || keys['D'] || keys['ArrowRight'] || d.steerR) ? 1 : 0,
                fire: netFireArmed ? 1 : 0
            };
        }

        function applyHostRemoteKeys() {
            // Map guest bits onto WASD keys used by car2
            keys['w'] = keys['W'] = !!netRemoteInput.u;
            keys['s'] = keys['S'] = !!netRemoteInput.d;
            keys['a'] = keys['A'] = !!netRemoteInput.l;
            keys['d'] = keys['D'] = !!netRemoteInput.r;
            if (netRemoteInput.fire) {
                shoot(car2);
                netRemoteInput.fire = 0;
            }
        }

        function disconnectRoom(reason) {
            netLeaveIntent = true;
            const ws = netWs;
            netWs = null;
            if (ws) {
                try { ws.close(); } catch (_) {}
            }
            netRole = null;
            netReady = false;
            netCode = '';
            netRemoteInput = { u:0, d:0, l:0, r:0, fire:0 };
            guestPendingState = null;
            applyPadMode();
            document.getElementById('leaveRoomBtn').hidden = true;
            document.getElementById('createRoomBtn').disabled = false;
            document.getElementById('joinRoomBtn').disabled = false;
            roomCodeInput.disabled = false;
            if (reason) setOnlineStatus(reason, 'err');
            else setOnlineStatus('');
            netLeaveIntent = false;
        }

        function connectRoom(code, asCreator) {
            code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
            if (code.length !== 4) {
                setOnlineStatus('Enter a 4-character code', 'err');
                return;
            }
            netLeaveIntent = false;
            if (netWs) disconnectRoom();
            netLeaveIntent = false;
            setOnlineStatus(asCreator ? 'Creating…' : 'Joining…');
            roomCodeInput.value = code;
            const ws = new WebSocket(`${ROOM_WS_BASE}?room=${encodeURIComponent(code)}`);
            netWs = ws;
            ws.onopen = () => {
                netCode = code;
                document.getElementById('leaveRoomBtn').hidden = false;
                document.getElementById('createRoomBtn').disabled = true;
                document.getElementById('joinRoomBtn').disabled = true;
                roomCodeInput.disabled = true;
            };
            ws.onmessage = (ev) => {
                let msg;
                try { msg = JSON.parse(ev.data); } catch { return; }
                if (msg.type === 'welcome') {
                    netRole = msg.seat; // host | guest
                    netReady = !!msg.ready;
                    tracks = [];
                    projectiles = [];
                    applyPadMode();
                    const label = netRole === 'host' ? 'Orange (host)' : 'Blue (guest)';
                    setOnlineStatus(netReady ? `${label} · ${msg.code} · ready` : `${label} · ${msg.code} · waiting…`, 'ok');
                    if (netRole === 'host') {
                        // Clear local P2 keys so only remote drives blue
                        ['w','W','a','A','s','S','d','D'].forEach(k => { keys[k] = false; });
                    }
                    if (netRole === 'guest') {
                        // Guest uses blue pad (WASD) / arrows also accepted via readLocalGuestBits
                        ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].forEach(k => { keys[k] = false; });
                    }
                } else if (msg.type === 'peer') {
                    netReady = !!msg.ready;
                    const label = netRole === 'host' ? 'Orange (host)' : 'Blue (guest)';
                    setOnlineStatus(netReady ? `${label} · ${netCode} · ready` : `${label} · ${netCode} · waiting…`, 'ok');
                } else if (msg.type === 'peer_left') {
                    setOnlineStatus('Other phone left', 'err');
                    netReady = false;
                } else if (msg.type === 'input' && netRole === 'host') {
                    netRemoteInput.u = msg.u|0;
                    netRemoteInput.d = msg.d|0;
                    netRemoteInput.l = msg.l|0;
                    netRemoteInput.r = msg.r|0;
                    if (msg.fire) netRemoteInput.fire = 1;
                } else if (msg.type === 'state' && netRole === 'guest') {
                    guestPendingState = msg;
                } else if (msg.type === 'reset' && netRole === 'guest') {
                    resetBasketball();
                }
            };
            ws.onclose = () => {
                if (netLeaveIntent) return;
                if (netWs === ws) disconnectRoom('Disconnected');
            };
            ws.onerror = () => setOnlineStatus('Connection failed', 'err');
        }

        async function createRoom() {
            try {
                setOnlineStatus('Creating…');
                const res = await fetch(ROOM_HTTP_BASE + '/create', { method: 'POST' });
                const data = await res.json();
                if (!data.code) throw new Error('no code');
                connectRoom(data.code, true);
            } catch (e) {
                setOnlineStatus('Could not create room', 'err');
            }
        }

        document.getElementById('createRoomBtn').addEventListener('click', createRoom);
        document.getElementById('joinRoomBtn').addEventListener('click', () => connectRoom(roomCodeInput.value, false));
        document.getElementById('leaveRoomBtn').addEventListener('click', () => disconnectRoom(''));
        roomCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') connectRoom(roomCodeInput.value, false);
        });


        function shoot(car) {
            if (!car || car.isShooting || car.isDestroyed || car.isStuckInGoal) return;
            projectiles.push(createProjectile(car));
            car.isShooting = true;
            playSound(600, 0.1, 'square');
            setTimeout(() => { car.isShooting = false; }, 120);
        }
                document.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            keys[e.key] = true;
            if (netRole === 'guest') {
                if (e.key === ' ' || e.key === 'q' || e.key === 'Q') { netFireArmed = true; }
                return;
            }
            if (netRole === 'host') {
                if (e.key === ' ') shoot(car1);
                if (e.key === 'r' || e.key === 'R') { resetBasketball(); netSend({ type: 'reset' }); }
                return;
            }
            if (e.key === ' ') shoot(car1);
            if (e.key === 'q' || e.key === 'Q') shoot(car2);
            if (e.key === 'r' || e.key === 'R') resetBasketball();
        });

                document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (netRole === 'guest' && (e.key === ' ' || e.key === 'q' || e.key === 'Q')) netFireArmed = false;
        });

        // Projectile creation
        function createProjectile(car) {
            const isReverse = car.speed < 0;
            const radius = isReverse ? 4 : 10;
            const offset = isReverse ? -car.width/2 : car.width/2;
            return {
                x: car.x + Math.cos(car.angle) * offset,
                y: car.y + Math.sin(car.angle) * offset,
                dx: Math.cos(car.angle) * projectileSpeed * (isReverse ? -1 : 1),
                dy: Math.sin(car.angle) * projectileSpeed * (isReverse ? -1 : 1),
                life: 60,
                radius: radius,
                owner: car
            };
        }

        // Track creation
        function createTrack(x, y, angle) {
            return {
                x: x,
                y: y,
                angle: angle,
                life: TRACK_LIFE
            };
        }

        // Update car movement based on controls
        let _gp0 = null, _gp1 = null;
        function refreshGamepads() {
            const GP = window.SimilarizeGamepad;
            _gp0 = GP ? GP.pollPad(0) : null;
            _gp1 = GP ? GP.pollPad(1) : null;
        }
        // Soccer RC drive: RT=forward, LT=reverse; stick/dpad steer only while thrusting.
        // Stick Y never auto-drives. Keyboard Up/W / Down/S still thrust/reverse.
        function padDrive(g) {
            if (!g || !g.connected) return { steerL:0, steerR:0, fwd:0, rev:0, thrusting:0 };
            const fwd = g.rt ? 1 : 0;
            const rev = g.lt ? 1 : 0;
            const thrusting = (fwd || rev) ? 1 : 0;
            const steerL = thrusting && (g.lx < -0.25 || g.dpad.l) ? 1 : 0;
            const steerR = thrusting && (g.lx > 0.25 || g.dpad.r) ? 1 : 0;
            return { steerL, steerR, fwd, rev, thrusting };
        }
        function updateCarControls(car) {
            if (car.isDestroyed) return;
            const isBothStuckOnConveyor = car1.onConveyor && car2.onConveyor && !car1.isDestroyed && !car2.isDestroyed;
            const isBothStuckInGoal = car1.isStuckInGoal && car2.isStuckInGoal;

            if (car.isStuckInGoal && !(car === car2 && isBothStuckInGoal)) return;
            if (car.onConveyor && !(car === car2 && isBothStuckOnConveyor)) return;

            const d0 = padDrive(_gp0);
            const d1 = padDrive(_gp1);

            if (car === car1) {
                if (keys['ArrowLeft'] || d0.steerL) car.rotation = -ROTATION_SPEED;
                else if (keys['ArrowRight'] || d0.steerR) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['ArrowUp'] || d0.fwd) car.speed = car.maxSpeed;
                else if (keys['ArrowDown'] || d0.rev) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }
            if (car === car2) {
                // pad1 only — single pad must not steal car2
                if (keys['a'] || keys['A'] || d1.steerL) car.rotation = -ROTATION_SPEED;
                else if (keys['d'] || keys['D'] || d1.steerR) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['w'] || keys['W'] || d1.fwd) car.speed = car.maxSpeed;
                else if (keys['s'] || keys['S'] || d1.rev) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }

            if (car.speed > 0 && !car.wasDriving) {
                playSound(200, 0.2, 'sawtooth', 0.2);
                car.wasDriving = true;
                car.wasReverse = false;
            } else if (car.speed < 0 && !car.wasReverse) {
                playSound(150, 0.3, 'sawtooth', 0.2);
                car.wasReverse = true;
                car.wasDriving = false;
            } else if (car.speed === 0) {
                car.wasDriving = false;
                car.wasReverse = false;
            }
        }

        // Draw car function with wheels underneath
        function drawCar(car, color) {
            if (car.isDestroyed) return;
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            ctx.beginPath();
            ctx.moveTo(-car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, car.height/2);
            ctx.lineTo(-car.width/2, car.height/2);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(car.width/2 - 10, -car.height/2 - 5);
            ctx.lineTo(car.width/2 - 10, -car.height/2);
            ctx.stroke();

            ctx.fillStyle = 'black';
            ctx.fillRect(-car.width/2 + 5, -car.height/2, 10, 16);
            ctx.fillRect(-car.width/2 + 5, car.height/2 - 16, 10, 16);
            ctx.fillRect(car.width/2 - 15, -car.height/2, 10, 16);
            ctx.fillRect(car.width/2 - 15, car.height/2 - 16, 10, 16);

            if (car.speed > 0 || (car.onConveyor && !car.isDestroyed)) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            if (car.speed < 0) {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(-car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Draw speckled background
        function drawBackground() {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, viewW, viewH);

            for (const speck of specks) {
                ctx.fillStyle = `rgba(255, 255, 255, ${speck.a})`;
                ctx.beginPath();
                ctx.arc(speck.x, speck.y, speck.r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#555555';
            ctx.fillRect(conveyor.x, conveyor.y, conveyor.width, conveyor.height);
            for (let i = 0; i < conveyor.width; i += 20) {
                ctx.fillStyle = '#333333';
                ctx.fillRect((i + Date.now() / 100 % 20), conveyor.y, 10, conveyor.height);
            }
        }

        // Draw hoop function
        function drawHoop(hoop) {
            ctx.fillStyle = 'gray';
            ctx.fillRect(hoop.x - hoop.width/2, hoop.y - hoop.rimThickness, hoop.width, hoop.rimThickness);
            ctx.fillStyle = 'white';
            ctx.fillRect(hoop.x - hoop.width/2 + 5, hoop.y - hoop.rimThickness - 20, hoop.width - 10, 20);
            ctx.strokeStyle = 'black';
            ctx.strokeRect(hoop.x - hoop.width/2 + 5, hoop.y - hoop.rimThickness - 20, hoop.width - 10, 20);
            ctx.strokeStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.width/2, hoop.y);
            ctx.lineTo(hoop.x - hoop.width/2, hoop.y + hoop.netHeight);
            ctx.moveTo(hoop.x + hoop.width/2, hoop.y);
            ctx.lineTo(hoop.x + hoop.width/2, hoop.y + hoop.netHeight);
            for (let i = 0; i < hoop.netHeight; i += 10) {
                ctx.moveTo(hoop.x - hoop.width/2 + i/2, hoop.y + i);
                ctx.lineTo(hoop.x + hoop.width/2 - i/2, hoop.y + i);
            }
            ctx.stroke();
        }

        // Game loop
        function applyGamepadActions() {
            // A = kick/shoot only. RT/LT are drive (handled in updateCarControls).
            const g0 = _gp0, g1 = _gp1;
            if (netRole === 'guest') {
                if (g0 && g0.connected && g0.buttonsPressed.a) netFireArmed = true;
                return;
            }
            if (netRole === 'host') {
                if (g0 && g0.connected && g0.buttonsPressed.a) shoot(car1);
                if (g0 && g0.connected && (g0.buttonsPressed.start || g0.buttonsPressed.back)) {
                    resetBasketball(); netSend({ type: 'reset' });
                }
                return;
            }
            if (g0 && g0.connected && g0.buttonsPressed.a) shoot(car1);
            if (g1 && g1.connected && g1.buttonsPressed.a) shoot(car2);
            if (g0 && g0.connected && (g0.buttonsPressed.start || g0.buttonsPressed.back)) resetBasketball();
        }
        function update() {
            refreshGamepads();
            applyGamepadActions();
            if (netRole === 'guest') {
                // Send inputs ~30Hz; render from host snapshots only
                const now = performance.now();
                if (now - guestInputTimer > 33) {
                    guestInputTimer = now;
                    const bits = readLocalGuestBits();
                    netSend(bits);
                    netFireArmed = false;
                }
                if (guestPendingState) {
                    applyStateMsg(guestPendingState);
                    guestPendingState = null;
                }
            } else if (netRole === 'host') {
                applyHostRemoteKeys();
            }

            drawBackground();

            if (netRole !== 'guest') {
            [car1, car2].forEach(car => {
                updateCarControls(car);
                if (car.isDestroyed) return;

                const isBothStuckOnConveyor = car1.onConveyor && car2.onConveyor && !car1.isDestroyed && !car2.isDestroyed;

                if (car.y + car.height/2 > conveyor.y) {
                    car.onConveyor = true;
                    if (!(car === car2 && isBothStuckOnConveyor)) {
                        car.x += conveyor.speed;
                        if (car.x > viewW) car.x = 0;
                    }
                } else if (!car.isStuckInGoal) {
                    car.onConveyor = false;
                }

                car.angle += car.rotation;
                const newX = (car.onConveyor && !(car === car2 && isBothStuckOnConveyor)) ? car.x : car.x + Math.cos(car.angle) * car.speed;
                const newY = car.onConveyor ? car.y : car.y + Math.sin(car.angle) * car.speed;

                if (car.speed !== 0 && !car.onConveyor) {
                    tracks.push(createTrack(car.x, car.y, car.angle));
                }

                car.x = newX;
                car.y = newY;

                if (car.x < 0) car.x = viewW;
                if (car.x > viewW) car.x = 0;
                if (car.y < 0) car.y = viewH;
                if (car.y > viewH) car.y = conveyor.y - car.height/2;

                if (!car.isStuckInGoal && 
                    car.x > (car === car1 ? hoop1.x : hoop2.x) - hoop1.width/2 && 
                    car.x < (car === car1 ? hoop1.x : hoop2.x) + hoop1.width/2 && 
                    car.y > hoop1.y - car.height/2 && 
                    car.y < hoop1.y + hoop1.netHeight + car.height/2) {
                    car.isStuckInGoal = true;
                    car.x = car === car1 ? hoop1.x : hoop2.x;
                    car.y = hoop1.y + hoop1.netHeight/2;
                    car.speed = 0;
                    car.rotation = 0;
                    playSound(250, 0.2, 'square', 0.3);
                }

                const dist = Math.hypot(car.x - basketball.x, car.y - basketball.y);
                if (dist < car.width/2 + basketball.radius) {
                    const angleToBasketball = Math.atan2(basketball.y - car.y, basketball.x - car.x);
                    if (basketball.isStuck) {
                        basketball.isStuck = false;
                        basketball.dy = car.y < basketball.y ? 2 : -2;
                        basketball.dx += Math.cos(angleToBasketball) * car.speed * 0.5;
                        playSound(300, 0.15, 'square', 0.3);
                    } else {
                        basketball.dx += Math.cos(angleToBasketball) * car.speed * 0.5;
                        basketball.dy += Math.sin(angleToBasketball) * car.speed * 0.5;
                        playSound(300, 0.15, 'square', 0.3);
                        const otherCar = car === car1 ? car2 : car1;
                        if (otherCar.isDestroyed) {
                            respawnCar(otherCar);
                        } else if (otherCar.onConveyor) {
                            otherCar.onConveyor = false;
                            otherCar.y = conveyor.y - car.height - 10;
                        } else if (otherCar.isStuckInGoal) {
                            otherCar.isStuckInGoal = false;
                            otherCar.y = car.y < basketball.y ? (otherCar === car1 ? hoop1.y : hoop2.y) + hoop1.netHeight + car.height/2 : (otherCar === car1 ? hoop1.y : hoop2.y) - car.height/2;
                            otherCar.dy = car.y < basketball.y ? 2 : -2;
                            playSound(300, 0.15, 'square', 0.3);
                        }
                    }
                }
            });

            if (!basketball.isStuck) {
                basketball.x += basketball.dx;
                basketball.y += basketball.dy;
                basketball.dx *= basketball.friction;
                basketball.dy *= basketball.friction;

                if (basketball.x - basketball.radius < 0) {
                    basketball.x = basketball.radius;
                    basketball.dx = -basketball.dx * 0.8;
                }
                if (basketball.x + basketball.radius > viewW) {
                    basketball.x = viewW - basketball.radius;
                    basketball.dx = -basketball.dx * 0.8;
                }
                if (basketball.y - basketball.radius < barrier.height) {
                    basketball.y = barrier.height + basketball.radius;
                    basketball.dy = -basketball.dy * 0.8;
                }
                if (basketball.y + basketball.radius > viewH) {
                    basketball.y = viewH - basketball.radius;
                    basketball.dy = -basketball.dy * 0.8;
                }

                if (basketball.x > hoop1.x - hoop1.width/2 && 
                    basketball.x < hoop1.x + hoop1.width/2 && 
                    basketball.y > hoop1.y - basketball.radius && 
                    basketball.y < hoop1.y + hoop1.netHeight && 
                    basketball.dy > 0 && !basketball.isStuck) {
                    basketball.isStuck = true;
                    basketball.x = hoop1.x;
                    basketball.y = hoop1.y + hoop1.netHeight/2;
                    basketball.dx = 0;
                    basketball.dy = 0;
                    const lastTouch = projectiles.length > 0 && projectiles[projectiles.length-1].owner ? 
                        projectiles[projectiles.length-1].owner : 
                        (Math.hypot(car1.x - basketball.x, car1.y - basketball.y) < Math.hypot(car2.x - basketball.x, car2.y - basketball.y) ? car1 : car2);
                    if (lastTouch === car1) {
                        car1.score++;
                        console.log('Score for Player 1!');
                    }
                }

                if (basketball.x > hoop2.x - hoop2.width/2 && 
                    basketball.x < hoop2.x + hoop2.width/2 && 
                    basketball.y > hoop2.y - basketball.radius && 
                    basketball.y < hoop2.y + hoop2.netHeight && 
                    basketball.dy > 0 && !basketball.isStuck) {
                    basketball.isStuck = true;
                    basketball.x = hoop2.x;
                    basketball.y = hoop2.y + hoop2.netHeight/2;
                    basketball.dx = 0;
                    basketball.dy = 0;
                    const lastTouch = projectiles.length > 0 && projectiles[projectiles.length-1].owner ? 
                        projectiles[projectiles.length-1].owner : 
                        (Math.hypot(car1.x - basketball.x, car1.y - basketball.y) < Math.hypot(car2.x - basketball.x, car2.y - basketball.y) ? car1 : car2);
                    if (lastTouch === car2) {
                        car2.score++;
                        console.log('Score for Player 2!');
                    }
                }
            }

            }

            ctx.fillStyle = 'silver';
            ctx.fillRect(barrier.x, barrier.y, barrier.width, barrier.height);

            tracks.forEach((track, index) => {
                track.life--;
                if (track.life <= 0) {
                    tracks.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.translate(track.x, track.y);
                ctx.rotate(track.angle);
                ctx.fillStyle = `rgba(0, 0, 0, ${track.life / TRACK_LIFE})`;
                ctx.fillRect(-car1.width/2 + 5, -car1.height/2 - 2, 8, 2);
                ctx.fillRect(-car1.width/2 + 5, car1.height/2, 8, 2);
                ctx.restore();
            });

            drawCar(car1, 'orange');
            drawCar(car2, 'blue');

            drawHoop(hoop1);
            drawHoop(hoop2);

            ctx.beginPath();
            ctx.arc(basketball.x, basketball.y, basketball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF4500';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            projectiles.forEach((projectile, pIndex) => {
                if (netRole === 'guest') {
                    ctx.beginPath();
                    ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    return;
                }
                projectile.x += projectile.dx;
                projectile.y += projectile.dy;
                projectile.life--;

                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                const distToBasketball = Math.hypot(projectile.x - basketball.x, projectile.y - basketball.y);
                if (distToBasketball < projectile.radius + basketball.radius) {
                    const angleToBasketball = Math.atan2(basketball.y - projectile.y, basketball.x - projectile.x);
                    const impactFactor = projectile.radius / basketball.radius;
                    if (!basketball.isStuck) {
                        basketball.dx += Math.cos(angleToBasketball) * projectileSpeed * impactFactor * 0.1;
                        basketball.dy += Math.sin(angleToBasketball) * projectileSpeed * impactFactor * 0.1;
                    }
                    projectile.dx = -projectile.dx * 0.8;
                    projectile.dy = -projectile.dy * 0.8;
                    playSound(400, 0.1, 'sine', 0.2);
                }

                const otherCar = projectile.owner === car1 ? car2 : car1;
                const distToCar = Math.hypot(projectile.x - otherCar.x, projectile.y - otherCar.y);
                if (distToCar < projectile.radius + otherCar.width/2 && !otherCar.isDestroyed) {
                    if (projectile.radius === 10) {
                        otherCar.isDestroyed = true;
                        playSound(100, 0.5, 'sawtooth', 0.4);
                        if (projectile.owner.onConveyor) {
                            projectile.owner.onConveyor = false;
                            projectile.owner.y = conveyor.y - projectile.owner.height - 10;
                        }
                    } else {
                        playSound(500, 0.1, 'triangle', 0.3);
                    }
                    projectiles.splice(pIndex, 1);
                    return;
                }

                if (projectile.life <= 0) projectiles.splice(pIndex, 1);
            });

            document.getElementById('s1').textContent = car1.score;
            document.getElementById('s2').textContent = car2.score;

            if (car1.isDestroyed || car2.isDestroyed) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                const bw = Math.min(viewW - 24, 420);
                ctx.fillRect((viewW - bw) / 2, 12, bw, 36);
                ctx.fillStyle = 'white';
                ctx.font = `${Math.max(14, 16 * S)}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('Hit the ball to bring the other car back', viewW / 2, 36);
                ctx.textAlign = 'left';
            }

            if (netRole === 'host' && netReady) {
                const now = performance.now();
                if (now - lastStateSent > 40) {
                    lastStateSent = now;
                    netSend(buildStateMsg());
                }
            }

            requestAnimationFrame(update);
        }

        const stage = document.querySelector('.stage');
        let laidOut = false;
        function applyCourt() {
            S = Math.max(0.55, Math.min(viewW / 800, viewH / 600));
            projectileSpeed = 5.4 * S;
            car1.width = car2.width = 44 * S;
            car1.height = car2.height = 22 * S;
            car1.maxSpeed = car2.maxSpeed = 3.6 * S;
            basketball.radius = 18 * S;
            hoop1.width = hoop2.width = 86 * S;
            hoop1.rimThickness = hoop2.rimThickness = Math.max(3, 5 * S);
            hoop1.netHeight = hoop2.netHeight = 42 * S;
            hoop1.x = viewW * 0.24;
            hoop2.x = viewW * 0.76;
            hoop1.y = hoop2.y = Math.max(52 * S, viewH * 0.16);
            barrier.x = 0;
            barrier.y = 0;
            barrier.width = viewW;
            barrier.height = Math.max(8, 12 * S);
            conveyor.height = Math.max(22, 34 * S);
            conveyor.y = viewH - conveyor.height;
            conveyor.width = viewW;
            conveyor.x = 0;
            conveyor.speed = 2.2 * S;
        }
        function placeFresh() {
            car1.x = viewW * 0.28;
            car1.y = viewH * 0.58;
            car1.angle = -Math.PI / 2;
            car2.x = viewW * 0.72;
            car2.y = viewH * 0.58;
            car2.angle = -Math.PI / 2;
            basketball.x = viewW / 2;
            basketball.y = viewH * 0.62;
            basketball.dx = 0;
            basketball.dy = 0;
            basketball.isStuck = false;
        }
        function makeSpecks() {
            specks = [];
            const n = Math.round(70 * (viewW * viewH) / (800 * 600));
            for (let i = 0; i < n; i++) {
                specks.push({
                    x: Math.random() * viewW,
                    y: Math.random() * viewH,
                    r: (Math.random() * 1.6 + 0.8) * S,
                    a: Math.random() * 0.28 + 0.08
                });
            }
        }
        function enterViewportFS() {
            try { if (window.SimilarizeViewportFS) window.SimilarizeViewportFS.enter(); } catch (_) {}
        }
        function fit() {
            const prevW = viewW, prevH = viewH;
            viewW = Math.max(280, stage.clientWidth);
            viewH = Math.max(180, stage.clientHeight);
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(viewW * dpr);
            canvas.height = Math.round(viewH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (laidOut && prevW > 0 && prevH > 0) {
                const sx = viewW / prevW, sy = viewH / prevH;
                [car1, car2].forEach((c) => { c.x *= sx; c.y *= sy; });
                basketball.x *= sx;
                basketball.y *= sy;
                basketball.dx *= sx;
                basketball.dy *= sy;
                projectiles.forEach((p) => { p.x *= sx; p.y *= sy; p.dx *= sx; p.dy *= sy; });
                tracks.forEach((t) => { t.x *= sx; t.y *= sy; });
            }
            applyCourt();
            if (!laidOut) placeFresh();
            laidOut = true;
            makeSpecks();
        }
        document.querySelectorAll('.cluster button[data-key]').forEach((btn) => {
            const k = btn.dataset.key;
            const down = (e) => {
                e.preventDefault();
                btn.setPointerCapture?.(e.pointerId);
                keys[k] = true;
                keys[k.toUpperCase()] = true;
                if (audioCtx.state === 'suspended') audioCtx.resume();
            };
            const up = () => { keys[k] = false; keys[k.toUpperCase()] = false; };
            btn.addEventListener('pointerdown', down);
            btn.addEventListener('pointerup', up);
            btn.addEventListener('pointercancel', up);
            btn.addEventListener('lostpointercapture', up);
        });
                document.querySelectorAll('[data-fire]').forEach((btn) => {
            const arm = (e) => {
                e.preventDefault();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startBackgroundMusic();
                const which = btn.dataset.fire;
                if (netRole === 'guest') {
                    if (which === '2') netFireArmed = true;
                    return;
                }
                if (netRole === 'host') {
                    if (which === '1') shoot(car1);
                    return;
                }
                shoot(which === '1' ? car1 : car2);
            };
            const disarm = () => { if (netRole === 'guest') netFireArmed = false; };
            btn.addEventListener('pointerdown', arm);
            btn.addEventListener('pointerup', disarm);
            btn.addEventListener('pointercancel', disarm);
            btn.addEventListener('lostpointercapture', disarm);
        });
        window.addEventListener('resize', fit);
        canvas.addEventListener('pointerdown', enterViewportFS, { once: false });
        document.getElementById('resetBtn')?.addEventListener('click', enterViewportFS);
        document.getElementById('soundBtn')?.addEventListener('click', enterViewportFS);
        fit();
        update();
    </script>
</body>
</html>
