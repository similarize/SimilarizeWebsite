    <!--
      Four Froggies 3D entry:
      - Requires ?go=1 to stay on this 3D world. Without go=1 the page redirects to
        /games/four-froggies/ (the version lobby). Live play:
        /games/four-froggies-3d/?go=1&v=20261008-space2
      - go=1 also adds html.ff3d-autostart (hides the seat gate; party-lobby auto-Starts).
      - ff3dsplit1: &view=split|shared picks the camera (default split when 2+ local players
        have frogs). In game: View pill (top-left), pad Back/View, or key V toggles.
        &splitdemo=N (testing) adds AI frogs as extra viewports.
      - ff3dcam1: Shared view auto-fits every human frog (ranch, outdoors). Camera controls in Shared and
        Split: pad right stick turns, stick up/down or D-pad up/down zooms, hold R3 + stick tilts, R3 twice
        resets; keys , . turn, PageUp/PageDown or Numpad +/- zoom, Home/End tilt, 0 resets; wheel; pinch and
        two-finger twist; - + reset buttons under the View pill.
      - ff3dspace1: scaled solar system (log-like orbits, Moon 18 u vs Station 5.4 u), launch lands you in sunlit
        Earth orbit, orbit-physics flight with assists (pad: D-pad L/R target, X auto-transfer, LB/RB warp, stick up/RT
        burns out of orbit, LT brakes, Y lands; keys T/R, G, Z/C, F). Mars cave + pups + crystals + rover ramps + dust
        storm; Callisto is landable (shards + beacons). Bundle index-ff3d112.js (111 left in place).
      - ff3dtouch1: phone joystick walks the frog and drives the Cybertruck/vehicles again (broken since 108);
        pinch/twist only count fingers on the canvas, never the joystick thumb. Bundle index-ff3d113.js (112 left in place).
      - ff3daudio1: sound effects via /games/shared/sfx.js (hops, boarding, launches, landings, pickups, splashes, scene
        whooshes, mission jingles, vehicle engine hum). Music stays the built-in loop. M or the speaker button mutes all.
        Bundle index-ff3d114.js (113 left in place).
      - loop1: the monster-truck track loop is a corkscrew. Inlet and outlet sit side by side (lanes 16 apart);
        trucks no longer drive through the back of the loop. Bundle index-ff3d115.js (114 left in place).
      - space1: real rocket rumble on liftoff (WebAudio); Deorbit + Leave orbit buttons in the space nav row (pad Y /
        stick up, keys F / O); nose follows the orbit tangent; Auto turns to face the target, then burns nose-first in a
        straight line; planets x1.6 / Sun 15 and Spotty ~0.9 u (Star Trek scale), close chase camera; stray orange cone,
        prograde/retrograde markers and the grey space floor removed. Bundle index-ff3d116.js (115 left in place).
      - space2: Deorbit = leave orbit into free flight (O / stick up / RT / Esc); separate Land button (Y / F) only
        while orbiting Earth (ranch pad), Mars or Callisto. Leave orbit button removed. Bundle index-ff3d117.js (116 kept).
    -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get("go") === "1") {
          document.documentElement.classList.add("ff3d-autostart");
          return;
        }
        params.delete("go");
        var query = params.toString();
        location.replace("/games/four-froggies/" + (query ? "?" + query : "") + location.hash);
      })();
    </script>
