<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 5px 0; }
        a { text-decoration: none; color: #0366d6; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Index of Files</h1>
    <ul id="file-list"></ul>

    <script>
        // Replace with your GitHub username and repository name
        const username = 'BenFlight';
        const repo = 'similarize/SimilarizeWebsite';
        const branch = 'main'; // Replace with your branch name (e.g., 'main' or 'gh-pages')

        // GitHub API URL to list contents of the repository
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents?ref=${branch}`;

        // Fetch the contents of the repository
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const fileList = document.getElementById('file-list');
                data.forEach(item => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = item.html_url.replace('https://github.com', `https://${username}.github.io/${repo}`);
                    link.textContent = item.name + (item.type === 'dir' ? '/' : '');
                    listItem.appendChild(link);
                    fileList.appendChild(listItem);
                });
            })
            .catch(error => {
                console.error('Error fetching repository contents:', error);
                document.getElementById('file-list').innerHTML = '<li>Unable to load files.</li>';
            });
    </script>
</body>
</html>
