<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Froggies Cybertruck Odyssey — Ranch Grounds</title>
  <link rel="stylesheet" href="style.css?v=20260925-names2">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="hud-top">
      <span id="lives">♥♥♥</span>
      <span id="scrap">Scrap 0</span>
      <span id="progress-label">Ranch Grounds</span>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="convoy-row"></div>
  </div>

  <div id="controls">
    <button type="button" id="btn-left" aria-label="Steer left">◀</button>
    <button type="button" id="btn-right" aria-label="Steer right">▶</button>
    <button type="button" id="btn-ability" aria-label="Ability">DASH</button>
  </div>

  <div id="overlay">
    <img id="splash-art" class="splash-art" src="assets/splash-forest-roof.png?v=20260925-names2" alt="Four froggies on a Cybertruck roof in the forest" width="832" height="1248" decoding="async">
    <h1 id="overlay-title">Froggies Cybertruck Odyssey</h1>
    <p id="overlay-sub">Ranch Grounds · Solo with AI buddies</p>
    <div id="frog-pick" class="frog-pick">
      <p class="pick-label">Pick your froggy</p>
      <div class="frog-btns">
        <button type="button" class="frog-btn" data-id="james">James<br><small>Wheel</small></button>
        <button type="button" class="frog-btn" data-id="jimmy">Jimmy<br><small>Shield</small></button>
        <button type="button" class="frog-btn" data-id="bubbles">Bubbles<br><small>Zap</small></button>
        <button type="button" class="frog-btn" data-id="rexy">Rexy<br><small>Bot</small></button>
      </div>
    </div>
    <p id="overlay-text">Steer left/right · tap ability · keep the convoy alive past the ranch house, track, and pond.</p>
    <p class="go" id="overlay-go">Tap a froggy to start · or tap GO for James</p>
    <button type="button" id="btn-start" class="start-btn">GO · Ranch Run</button>
  </div>

  <script src="ai.js?v=20260925-names2"></script>
  <script src="main.js?v=20260925-names2"></script>
</body>
</html>
