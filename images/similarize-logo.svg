<svg class="logo-anim" id="logo-anim" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-hidden="true" focusable="false">
  <defs>
    <style><![CDATA[
      .logo-root .word { opacity: 0; }
      .logo-root .mark { opacity: 1; }

      .logo-root.is-animating .word {
        animation: wordPhase 3.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: 200px 200px;
      }
      .logo-root.is-animating .mark {
        animation: markPhase 3.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: 200px 200px;
      }

      @keyframes wordPhase {
        0%, 28% { opacity: 1; transform: scale(1); }
        58% { opacity: 0; transform: scale(0.72); }
        100% { opacity: 0; transform: scale(0.62); }
      }
      @keyframes markPhase {
        0%, 32% { opacity: 0; transform: scale(0.55); }
        58% { opacity: 1; transform: scale(1.03); }
        78%, 100% { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-root.is-animating .word,
        .logo-root.is-animating .mark { animation: none !important; }
        .logo-root.is-animating .word { opacity: 0 !important; }
        .logo-root.is-animating .mark { opacity: 1 !important; transform: none !important; }
      }
    ]]></style>
  </defs>

  <g class="logo-root" id="logo-root">
    <image class="word" id="word"
      href="images/logo-word.png?v=20260925g"
      xlink:href="images/logo-word.png?v=20260925g"
      x="20" y="120" width="360" height="160"
      preserveAspectRatio="xMidYMid meet"/>
    <image class="mark" id="mark"
      href="images/imi-mark-clean.png?v=20260925g"
      xlink:href="images/imi-mark-clean.png?v=20260925g"
      x="16" y="16" width="368" height="368"
      preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
