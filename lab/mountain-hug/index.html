<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Similarize — Mountain Hug mark animation</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#1f2937;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center;gap:14px}
#mark{width:min(92vw,560px);aspect-ratio:1250/560}
.tag{color:#6b7280;letter-spacing:.035em;font-weight:500;opacity:0;transition:opacity .8s}
.tag.show{opacity:1}
button{font:inherit;border:0;border-radius:999px;padding:.55rem 1.1rem;background:#15803d;color:#fff;font-weight:600;cursor:pointer}
</style></head><body>
<div id="mark"></div>
<div class="tag" id="tag">removing the mountains between us</div>
<button id="replay">Replay</button>
<script src="similarize-mark.js?v=4"></script>
<script>
var tag=document.getElementById('tag');
var anim=SimilarizeMark.create(document.getElementById('mark'),{autoplay:!/[?&]still/.test(location.search),onDone:function(){tag.classList.add('show')}});
document.getElementById('replay').onclick=function(){tag.classList.remove('show');anim.play()};
window.__anim=anim;
</script></body></html>
