:root {

  --radius: 28px;

* { box-sizing: border-box; }
input, textarea {
  -webkit-user-select: text !important;
  user-select: text;
  cursor: text;
  touch-action: manipulation;
  font-size: 16px;
}
html { scroll-behavior: smooth; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
}
body {
  font-family: "Outfit", "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
  padding:

    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
  line-height: 1.5;
}
@media (display-mode: standalone), (display-mode: fullscreen) {
  html, body { overscroll-behavior: none; }
}
a { color: var(--green-dark); }
.skip {
  position: absolute; left: -999px; top: 0;
  background: var(--green); color: white; padding: 0.5rem 1rem; z-index: 20;
}
.skip:focus { left: 1rem; top: 1rem; }
.shell {
  width: min(var(--max), calc(100% - 2rem));
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.home {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2.5rem 0 1.5rem;
  transition: padding 0.2s ease;
}
.shell.has-results .home {
  justify-content: flex-start;
  padding-top: 1.25rem;
  padding-bottom: 0.75rem;
}
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
  margin-bottom: 1.35rem;
  text-align: center;
}
.brand .logo {
  display: block;
  line-height: 0;
}
.brand img {
  width: clamp(132px, 32vw, 180px);
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  border-radius: 50%;
  background: #b91c1c;
}
.composer {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 0.55rem;
  display: grid;
  gap: 0.45rem;
}
.composer label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
textarea {
  width: 100%;
  min-height: 5.5rem;
  resize: vertical;
  border: 0;
  border-radius: calc(var(--radius) - 8px);
  padding: 0.85rem 1rem 0.35rem;
  font-family: inherit;
  color: inherit;
  background: transparent;
  line-height: 1.45;
}
textarea:focus { outline: none; }
.composer:focus-within {
  border-color: rgba(21,128,61,0.45);
  box-shadow: var(--shadow), 0 0 0 3px rgba(21,128,61,0.12);
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0 0.35rem 0.2rem 0.55rem;
}
.count {
  font-size: 0.78rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 0.15s ease;
}
.count.show { opacity: 1; }
.count.warn { color: #9f1239; font-weight: 600; }
button, .btn {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 999px;
  padding: 0.62rem 1.15rem;
  font-weight: 600;
}
.primary {
  background: var(--green);
  color: white;
}
.primary:hover { background: var(--green-dark); }
.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  padding: 0.4rem 0.7rem;
  font-size: 0.85rem;
  font-weight: 500;
}
.ghost:hover { color: var(--ink); }
.results {
  padding: 0.5rem 0 2rem;
  display: grid;
  gap: 1rem;
}
.results.hidden { display: none; }
.reception {
  background: var(--green-soft);
  border: 1px solid rgba(21,128,61,0.18);
  border-radius: 18px;
  padding: 1rem 1.1rem;
}
.reception h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.05rem;
  font-weight: 650;
  margin: 0 0 0.35rem;
  letter-spacing: -0.02em;
}
.reception .summary {
  margin: 0 0 0.55rem;
  color: var(--green-ink);
  font-size: 0.98rem;

.reception ul {

  color: var(--green-dark);
  font-size: 0.92rem;

.reception li { margin: 0.2rem 0; }
.toolbar {

  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.toolbar h2 {

  font-size: 1.15rem;
  margin: 0;
  letter-spacing: -0.02em;

.share-status { font-size: 0.8rem; color: var(--green); min-height: 1.1em; }
.cards { display: grid; gap: 0.75rem; }
.card {

  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 0.95rem 1rem;

.card .kicker {
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 0.35rem;

.card .wording {
  font-size: 1.05rem;
  margin: 0 0 0.75rem;
  line-height: 1.45;

.card .actions {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;

.copy-btn {
  background: var(--green-soft);

  border: 1px solid rgba(21,128,61,0.2);
  font-size: 0.85rem;
  padding: 0.4rem 0.85rem;

.copy-btn:hover { background: #bbf7d0; }
footer.site {

footer.site a:hover {

.sep { margin: 0 0.45rem; opacity: 0.5; }

.icon-btn {

    return (
      "<h2>How this may land</h2>" +
      '<p class="summary">' + esc(rec.summary || "") + "</p>" +
      (items ? "<ul>" + items + "</ul>" : "")
    );
  }

  function cardHtml(item) {
    return (
      '<article class="card" data-text="' + esc(item.text) + '">' +
        '<div class="kicker">' + esc(item.label) + "</div>" +
        '<p class="wording">' + esc(item.text) + "</p>" +
        '<div class="actions"><button type="button" class="copy-btn" data-copy>Copy</button></div>' +
      "</article>"
    );
  }

  function pickVariants(all) {
    var byId = {};
    for (var i = 0; i < all.length; i++) byId[all[i].id] = all[i];
    var out = [];
    for (var j = 0; j < PREFERRED.length; j++) {
      if (byId[PREFERRED[j]]) out.push(byId[PREFERRED[j]]);
    }
    return out.length ? out : all.slice(0, 3);
  }

  function render(text) {
    originalText = text.trim();
    if (!originalText) return;
    var rec = Similarize.reception(originalText);
    var variants = pickVariants(Similarize.rewrite(originalText));
    receptionEl.innerHTML = receptionHtml(rec);
    var html = "";
    for (var i = 0; i < variants.length; i++) html += cardHtml(variants[i]);
    cards.innerHTML = html;
    results.classList.remove("hidden");
    shell.classList.add("has-results");
    writeShare(originalText);
    shareStatus.textContent = "";
    results.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!input.value.trim()) return;
    render(input.value);
  });

  input.addEventListener("input", updateCount);

  cards.addEventListener("click", function (e) {
    var copyBtn = e.target.closest("[data-copy]");
    if (!copyBtn) return;
    var article = copyBtn.closest(".card");
    var text = article.getAttribute("data-text");
    navigator.clipboard.writeText(text).then(function () {
      copyBtn.textContent = "Copied";
      setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
    });
  });

  shareBtn.addEventListener("click", function () {
    if (!originalText) return;
    var url = shareUrl(originalText);
    navigator.clipboard.writeText(url).then(function () {
      shareStatus.textContent = "Copied";
    }).catch(function () {
      shareStatus.textContent = url;
    });
  });

  function showPaywall(info) {
    var cents = (info && info.session_price_cents) || 25;
    if (talkPrice) talkPrice.textContent = (cents / 100).toFixed(2);
    if (paywall) {
      paywall.hidden = false;
      paywall.classList.add("show");
    }
  }

  function setVoiceHint(msg, warn) {
    if (!voiceHint) return;
    voiceHint.textContent = msg || "";
    voiceHint.classList.toggle("warn", !!warn);
  }

  var talk = null;
  if (window.SimilarizeTalk && SimilarizeTalk.TalkController && talkBtn) {
    talk = new SimilarizeTalk.TalkController({
      onStatus: function (msg, warn) {
        setVoiceHint(msg, warn);
        talkBtn.classList.toggle("listening", !!(talk && talk.listening));
        talkBtn.setAttribute("aria-pressed", talk && talk.listening ? "true" : "false");
      },
      onTranscript: function (text) {
        if (!text) return;
        input.value = text;
        updateCount();
      },
      onPackaged: function (text) {
        if (!text) return;
        input.value = text;
        updateCount();
        render(text);
      },
      onPaymentRequired: function (info) {
        showPaywall(info);
        setVoiceHint("Talk is $" + (((info && info.session_price_cents) || 25) / 100).toFixed(2) + " — typed Similarize stays free.", true);
        talkBtn.classList.remove("listening");
        talkBtn.setAttribute("aria-pressed", "false");
      }
    });

    talkBtn.addEventListener("click", function () {
      if (paywall) {
        paywall.hidden = true;
        paywall.classList.remove("show");
      }
      talk.toggle().catch(function () {});
    });
  }

  var shared = readShared();
  if (shared) {
    if (Array.from(shared).length > MAX) shared = Array.from(shared).slice(0, MAX).join("");
    input.value = shared;
    updateCount();
    render(shared);
  } else {
    updateCount();
  }
})();
  </script>
</body>
</html>
