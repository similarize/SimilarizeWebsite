name: Unity WebGL - Balloon Blast U6 PRIVATE PREVIEW (bb-unity6 -> games/preview/balloon-blast-u6 only)

# Private, unlisted preview of the bb-unity6 branch. Publishes ONLY to games/preview/balloon-blast-u6 on gh-pages
# (not linked from any index page, noindex). Never touches games/balloon-blast-unity or unity-src.
on:
  push:
    branches: [bb-unity6]
    paths:
      - 'unity/balloon-blast/**'
      - '.github/workflows/unity-balloon-blast-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-webgl-bb-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: src/unity/balloon-blast

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout bb-unity6
        uses: actions/checkout@v4
        with:
          ref: bb-unity6
          path: src

      - name: Prepare log dir
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }} event ${{ github.event_name }} sha ${{ github.sha }} started $(date -u +%FT%TZ)" > "$RUNNER_TEMP/logs/status.txt"

      - name: Check Unity secrets
        id: secrets
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          e=no; p=no
          [ -n "$UE" ] && e=yes
          [ -n "$UP" ] && p=yes
          if [ "$e" != yes ] || [ "$p" != yes ]; then
            echo "MISSING_SECRETS: UNITY_EMAIL set=$e UNITY_PASSWORD set=$p" | tee -a "$LOG_DIR/status.txt"
            exit 1
          fi
          echo "secrets present" | tee -a "$LOG_DIR/status.txt"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tee -a "$LOG_DIR/status.txt"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: BBP-Library-WebGL-${{ hashFiles('src/unity/balloon-blast/Packages/manifest.json', 'src/unity/balloon-blast/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('src/unity/balloon-blast/Assets/**') }}
          restore-keys: |
            BBP-Library-WebGL-${{ hashFiles('src/unity/balloon-blast/Packages/manifest.json', 'src/unity/balloon-blast/ProjectSettings/ProjectVersion.txt') }}-
            BBP-Library-WebGL-

      # Hub 3.20+ installs to /usr/lib/unityhub but unity-setup@v2 still checks /opt/unityhub.
      # Pass 1 installs the Hub (and fails on that path check), the shim links the dir, pass 2 continues.
      - name: Set up Unity Hub (pass 1)
        id: unity-hub-install
        continue-on-error: true
        timeout-minutes: 6
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: src/unity/balloon-blast/ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          cache-installation: true

      - name: Unity Hub path shim
        run: |
          echo "hub pass1: ${{ steps.unity-hub-install.outcome }}" | tee -a "$LOG_DIR/status.txt"
          ls -la /usr/lib/unityhub/unityhub /opt/unityhub 2>&1 | tee -a "$LOG_DIR/status.txt" || true
          if [ ! -e /opt/unityhub/unityhub ]; then
            if [ -x /usr/lib/unityhub/unityhub ]; then
              sudo rm -rf /opt/unityhub
              sudo ln -s /usr/lib/unityhub /opt/unityhub
            else
              B=$(readlink -f "$(command -v unityhub)" 2>/dev/null || true)
              echo "unityhub resolves to: $B" | tee -a "$LOG_DIR/status.txt"
              [ -n "$B" ] && sudo mkdir -p /opt/unityhub && sudo ln -sf "$B" /opt/unityhub/unityhub
            fi
          fi
          ls -la /opt/unityhub/unityhub 2>&1 | tee -a "$LOG_DIR/status.txt" || true

      - name: Set up Unity + WebGL
        id: unity-setup
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: src/unity/balloon-blast/ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          cache-installation: true
          auto-update-hub: false

      - name: Activate Unity license
        id: activate
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build WebGL
        id: build
        run: |
          EDITOR="${UNITY_EDITOR_PATH:-${{ steps.unity-setup.outputs.unity-editor-path }}}"
          echo "editor: $EDITOR" | tee -a "$LOG_DIR/status.txt"
          code=0
          "$EDITOR" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_DIR" \
            -buildTarget WebGL \
            -executeMethod BuildScript.BuildWebGL \
            -logFile "$LOG_DIR/editor.log" || code=$?
          echo "unity exit code: $code" | tee -a "$LOG_DIR/status.txt"
          ls -la "$PROJECT_DIR/build/WebGL" "$PROJECT_DIR/build/WebGL/Build" 2>&1 | tee -a "$LOG_DIR/status.txt" || true
          if [ "$code" != "0" ]; then exit 1; fi
          ls "$PROJECT_DIR"/build/WebGL/Build/*.loader.js > /dev/null

      - name: Publish PRIVATE preview (unlisted path only)
        id: publish
        if: success() && github.ref == 'refs/heads/bb-unity6'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_DIR: games/preview/balloon-blast-u6
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/$PROJECT_DIR/build/WebGL"
          LOADER=$(ls "$OUT"/Build/*.loader.js | head -n1)
          NAME=$(basename "$LOADER" .loader.js)
          VERSION="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          git clone --depth 1 --branch gh-pages --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          cd site
          git sparse-checkout set "$GAME_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          rm -rf "$GAME_DIR"
          mkdir -p "$GAME_DIR"
          cp -r "$OUT/Build" "$GAME_DIR/Build"
          if [ -d "$OUT/StreamingAssets" ]; then cp -r "$OUT/StreamingAssets" "$GAME_DIR/"; fi
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/web/LICENSES.txt" "$GAME_DIR/LICENSES.txt" || true
          sed -e "s/__BUILD_NAME__/$NAME/g" -e "s/__BUILD_VERSION__/$VERSION/g" -e 's#href="../"#href="/games/"#' -e 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' "$GITHUB_WORKSPACE/src/unity/web/index.html" > "$GAME_DIR/index.html"
          git add -A "$GAME_DIR"
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Private preview: Balloon Blast U6 (bb-unity6) $VERSION"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then echo "published preview" | tee -a "$LOG_DIR/status.txt"; exit 0; fi
            sleep $((i*3))
            git pull --rebase origin gh-pages
          done
          exit 1

      - name: Summarise errors
        if: always()
        run: |
          {
            cat "$LOG_DIR/status.txt" 2>/dev/null
            echo "=== step outcomes: secrets=${{ steps.secrets.outcome }} setup=${{ steps.unity-setup.outcome }} activate=${{ steps.activate.outcome }} build=${{ steps.build.outcome }} publish=${{ steps.publish.outcome }}"
            if [ -f "$LOG_DIR/editor.log" ]; then
              echo "=== error lines"
              grep -nE "error CS|Scripts have compiler errors|Exception|BUILD_" "$LOG_DIR/editor.log" | grep -v "0 errors" | head -n 200
            fi
          } > "$LOG_DIR/summary.txt" 2>&1
          cat "$LOG_DIR/summary.txt"
          grep -E "error CS" "$LOG_DIR/editor.log" 2>/dev/null | sort -u | head -n 50 | while read -r l; do echo "::error::$l"; done || true

      - name: Scrub credentials from logs
        if: always()
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for f in "$LOG_DIR"/*; do
            [ -f "$f" ] || continue
            if [ -n "$UE" ]; then perl -pi -e 's/\Q$ENV{UE}\E/[UNITY_EMAIL]/g' "$f"; fi
            if [ -n "$UP" ]; then perl -pi -e 's/\Q$ENV{UP}\E/[UNITY_PASSWORD]/g' "$f"; fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log-${{ github.run_id }}
          path: ${{ env.LOG_DIR }}
          retention-days: 14
