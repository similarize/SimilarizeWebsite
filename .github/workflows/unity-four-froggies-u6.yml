name: Unity WebGPU - Four Froggies 6.6 (Unity 6.6 URP)

on:
  workflow_dispatch:
  push:
    branches: [unity-src]
    paths:
      - 'unity/four-froggies-u6/**'
      - '.github/workflows/unity-four-froggies-u6.yml'

permissions:
  contents: write

concurrency:
  group: unity-webgl-four-froggies-u6
  cancel-in-progress: true

env:
  PROJECT_DIR: src/unity/four-froggies-u6
  GAME_DIR: games/four-froggies-u6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout unity-src
        uses: actions/checkout@v4
        with:
          ref: unity-src
          path: src

      - name: Prepare log dir
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }} event ${{ github.event_name }} sha ${{ github.sha }} started $(date -u +%FT%TZ)" > "$RUNNER_TEMP/logs/status.txt"

      - name: Check Unity secrets
        id: secrets
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          e=no; p=no
          [ -n "$UE" ] && e=yes
          [ -n "$UP" ] && p=yes
          if [ "$e" != yes ] || [ "$p" != yes ]; then
            echo "MISSING_SECRETS: UNITY_EMAIL set=$e UNITY_PASSWORD set=$p" | tee -a "$LOG_DIR/status.txt"
            exit 1
          fi
          echo "secrets present" | tee -a "$LOG_DIR/status.txt"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tee -a "$LOG_DIR/status.txt"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: FFU6-Library-WebGL-${{ hashFiles('src/unity/four-froggies-u6/Packages/manifest.json', 'src/unity/four-froggies-u6/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('src/unity/four-froggies-u6/Assets/**') }}
          restore-keys: |
            FFU6-Library-WebGL-${{ hashFiles('src/unity/four-froggies-u6/Packages/manifest.json', 'src/unity/four-froggies-u6/ProjectSettings/ProjectVersion.txt') }}-
            FFU6-Library-WebGL-

      # Hub 3.20+ installs to /usr/lib/unityhub but unity-setup@v2 still checks /opt/unityhub.
      # Pass 1 installs the Hub (and fails on that path check), the shim links the dir, pass 2 continues.
      - name: Set up Unity Hub (pass 1)
        id: unity-hub-install
        continue-on-error: true
        timeout-minutes: 6
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: src/unity/four-froggies-u6/ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          cache-installation: true

      - name: Unity Hub path shim
        run: |
          echo "hub pass1: ${{ steps.unity-hub-install.outcome }}" | tee -a "$LOG_DIR/status.txt"
          ls -la /usr/lib/unityhub/unityhub /opt/unityhub 2>&1 | tee -a "$LOG_DIR/status.txt" || true
          if [ ! -e /opt/unityhub/unityhub ]; then
            if [ -x /usr/lib/unityhub/unityhub ]; then
              sudo rm -rf /opt/unityhub
              sudo ln -s /usr/lib/unityhub /opt/unityhub
            else
              B=$(readlink -f "$(command -v unityhub)" 2>/dev/null || true)
              echo "unityhub resolves to: $B" | tee -a "$LOG_DIR/status.txt"
              [ -n "$B" ] && sudo mkdir -p /opt/unityhub && sudo ln -sf "$B" /opt/unityhub/unityhub
            fi
          fi
          ls -la /opt/unityhub/unityhub 2>&1 | tee -a "$LOG_DIR/status.txt" || true

      - name: Set up Unity + WebGL
        id: unity-setup
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: src/unity/four-froggies-u6/ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          cache-installation: true
          auto-update-hub: false

      - name: Activate Unity license
        id: activate
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: URP setup pass (creates pipeline assets, then exits so the next editor start has URP active)
        id: urpsetup
        run: |
          EDITOR="${UNITY_EDITOR_PATH:-${{ steps.unity-setup.outputs.unity-editor-path }}}"
          code=0
          "$EDITOR" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_DIR" \
            -buildTarget WebGL \
            -executeMethod BuildScript.SetupURP \
            -logFile "$LOG_DIR/setup.log" || code=$?
          echo "urp setup exit code: $code" | tee -a "$LOG_DIR/status.txt"
          grep -E "URPSETUP|error CS|Exception|[Ll]icens" "$LOG_DIR/setup.log" | head -n 80 | tee -a "$LOG_DIR/status.txt" || true
          if [ "$code" != "0" ]; then tail -n 200 "$LOG_DIR/setup.log" >> "$LOG_DIR/status.txt"; exit 1; fi

      - name: Build WebGL
        id: build
        run: |
          EDITOR="${UNITY_EDITOR_PATH:-${{ steps.unity-setup.outputs.unity-editor-path }}}"
          echo "editor: $EDITOR" | tee -a "$LOG_DIR/status.txt"
          code=0
          "$EDITOR" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_DIR" \
            -buildTarget WebGL \
            -executeMethod BuildScript.BuildWebGL \
            -logFile "$LOG_DIR/editor.log" || code=$?
          echo "unity exit code: $code" | tee -a "$LOG_DIR/status.txt"
          ls -la "$PROJECT_DIR/build/WebGL" "$PROJECT_DIR/build/WebGL/Build" 2>&1 | tee -a "$LOG_DIR/status.txt" || true
          if [ "$code" != "0" ]; then exit 1; fi
          ls "$PROJECT_DIR"/build/WebGL/Build/*.loader.js > /dev/null

      - name: Publish to gh-pages
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/$PROJECT_DIR/build/WebGL"
          LOADER=$(ls "$OUT"/Build/*.loader.js | head -n1)
          NAME=$(basename "$LOADER" .loader.js)
          VERSION="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          git clone --depth 1 --branch gh-pages --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          cd site
          git sparse-checkout set "$GAME_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          rm -rf "$GAME_DIR"
          mkdir -p "$GAME_DIR"
          cp -r "$OUT/Build" "$GAME_DIR/Build"
          if [ -d "$OUT/StreamingAssets" ]; then cp -r "$OUT/StreamingAssets" "$GAME_DIR/"; fi
          sed -e "s/__BUILD_NAME__/$NAME/g" -e "s/__BUILD_VERSION__/$VERSION/g" "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/index.html" > "$GAME_DIR/index.html"
          if [ -f "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/LICENSES.txt" ]; then cp "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/LICENSES.txt" "$GAME_DIR/LICENSES.txt"; fi
          # ffu10: streamed music + ambience (Ogg Vorbis, loaded per stage by Plugins/FFAudio.jslib)
          if [ -d "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/audio" ]; then rm -rf "$GAME_DIR/audio"; cp -r "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/audio" "$GAME_DIR/audio"; fi
          if [ -d "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/real" ]; then rm -rf "$GAME_DIR/real"; cp -r "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/real" "$GAME_DIR/real"; fi
          if [ -d "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/realroom" ]; then rm -rf "$GAME_DIR/realroom"; cp -r "$GITHUB_WORKSPACE/src/unity/four-froggies-u6/web/realroom" "$GAME_DIR/realroom"; fi
          git add -A "$GAME_DIR"
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Publish Four Froggies 6.6 (Unity 6.6 WebGPU) build $VERSION"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then echo "published" | tee -a "$LOG_DIR/status.txt"; exit 0; fi
            sleep $((i*3))
            git pull --rebase origin gh-pages
          done
          echo "PUBLISH_FAILED" | tee -a "$LOG_DIR/status.txt"
          exit 1

      - name: Commit build log to unity-src
        if: always()
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          cd src
          mkdir -p unity/logs
          L=unity/logs/four-froggies-u6-last-build.log
          {
            cat "$LOG_DIR/status.txt" 2>/dev/null
            echo "=== step outcomes: secrets=${{ steps.secrets.outcome }} setup=${{ steps.unity-setup.outcome }} activate=${{ steps.activate.outcome }} urpsetup=${{ steps.urpsetup.outcome }} build=${{ steps.build.outcome }} publish=${{ steps.publish.outcome }}"
            for f in $(find "$HOME/.config/unity3d" -maxdepth 3 -name "*.log" 2>/dev/null); do
              echo "=== $f (tail 60)"; tail -n 60 "$f"
            done
            if [ -f "$LOG_DIR/setup.log" ]; then
              echo "=== URP setup log: key lines"
              grep -nE "URPSETUP|error CS|[Ee]rror:|Exception|[Ll]icens" "$LOG_DIR/setup.log" | head -n 120
              if [ ! -f "$LOG_DIR/editor.log" ]; then echo "=== setup log tail (300)"; tail -n 300 "$LOG_DIR/setup.log"; fi
            fi
            if [ -f "$LOG_DIR/editor.log" ]; then
              echo "=== shader errors"
              grep -nE "Shader error|shader error|Shader warning in 'FF|Shader warning in 'LB" "$LOG_DIR/editor.log" | head -n 120
              echo "=== error lines"
              grep -nE "error CS|[Ee]rror:|Exception|BUILD_|BuildScript|Scripts have compiler errors|[Ll]icens|Failed|failed" "$LOG_DIR/editor.log" | grep -vE "Shader.*warning|0 errors" | head -n 250
              echo "=== editor log tail (400)"
              tail -n 400 "$LOG_DIR/editor.log"
            else
              echo "=== no editor log"
            fi
          } > "$L" 2>&1
          # scrub credentials from the committed log
          if [ -n "$UE" ]; then perl -pi -e 's/\Q$ENV{UE}\E/[UNITY_EMAIL]/g' "$L"; fi
          if [ -n "$UP" ]; then perl -pi -e 's/\Q$ENV{UP}\E/[UNITY_PASSWORD]/g' "$L"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "$L"
          git commit -m "Four Froggies 6.6 build log for run ${{ github.run_id }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git push origin HEAD:unity-src && exit 0
            sleep $((i*2))
            git pull --rebase origin unity-src || true
          done
          exit 0
