<!DOCTYPE html>
<html>
<head>
    <title>Basketball RC Car - 2 Player Version</title>
    <style>
        canvas {
            border: 1px solid black;
            background: #000;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="controls">
        <label><input type="checkbox" id="soundToggle" checked> Sound Effects</label><br>
        <label><input type="checkbox" id="musicToggle" checked> Background Music</label><br>
        <span>Press 'R' to reset ball</span>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Player 1 RC car (orange)
        const car1 = {
            x: canvas.width / 4,
            y: canvas.height / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false,
            score: 0,
            wasDriving: false,
            wasReverse: false,
            isDestroyed: false
        };

        // Player 2 RC car (blue)
        const car2 = {
            x: 3 * canvas.width / 4,
            y: canvas.height / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false,
            score: 0,
            wasDriving: false,
            wasReverse: false,
            isDestroyed: false
        };

        // Basketball object
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 20,
            radius: 20,
            dx: 0,
            dy: 0,
            friction: 0.98,
            isStuck: false
        };

        // Basketball hoop
        const hoop = {
            x: canvas.width / 2,
            y: 100,
            width: 60,
            height: 10,
            rimThickness: 5,
            netHeight: 30
        };

        // Metal barrier
        const barrier = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: 20
        };

        // Game variables
        let projectiles = [];
        let tracks = [];
        const ROTATION_SPEED = 0.1;
        const PROJECTILE_SPEED = 5;
        const TRACK_LIFE = 120;

        // Sound toggle controls
        const soundToggle = document.getElementById('soundToggle');
        const musicToggle = document.getElementById('musicToggle');
        let backgroundOscillator = null;

        // Sound effects
        function playSound(frequency, duration, type = 'sine', volume = 0.3) {
            if (!soundToggle.checked) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // Background music
        function startBackgroundMusic() {
            if (!musicToggle.checked || backgroundOscillator) return;
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00];
            let noteIndex = 0;
            backgroundOscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            backgroundOscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            backgroundOscillator.type = 'triangle';
            gainNode.gain.value = 0.1;
            backgroundOscillator.frequency.value = notes[noteIndex];
            backgroundOscillator.start();

            setInterval(() => {
                if (musicToggle.checked) {
                    noteIndex = (noteIndex + 1) % notes.length;
                    backgroundOscillator.frequency.value = notes[noteIndex];
                }
            }, 500);
        }

        function stopBackgroundMusic() {
            if (backgroundOscillator) {
                backgroundOscillator.stop();
                backgroundOscillator = null;
            }
        }

        musicToggle.addEventListener('change', () => {
            if (musicToggle.checked) startBackgroundMusic();
            else stopBackgroundMusic();
        });

        startBackgroundMusic();

        // Reset ball function
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - ball.radius;
            ball.dx = 0;
            ball.dy = 0;
            ball.isStuck = false;
            playSound(700, 0.2, 'sine', 0.2);
        }

        // Respawn car function
        function respawnCar(car) {
            car.x = car === car1 ? canvas.width / 4 : 3 * canvas.width / 4;
            car.y = canvas.height / 2;
            car.angle = 0;
            car.speed = 0;
            car.rotation = 0;
            car.isDestroyed = false;
            playSound(800, 0.3, 'sine', 0.2);
        }

        // Controls for both players
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && !car1.isShooting && !car1.isDestroyed) {
                projectiles.push(createProjectile(car1));
                car1.isShooting = true;
                playSound(600, 0.1, 'square');
                setTimeout(() => car1.isShooting = false, 100);
            }
            if ((e.key === 'q' || e.key === 'Q') && !car2.isShooting && !car2.isDestroyed) {
                projectiles.push(createProjectile(car2));
                car2.isShooting = true;
                playSound(600, 0.1, 'square');
                setTimeout(() => car2.isShooting = false, 100);
            }
            if (e.key === 'r' || e.key === 'R') {
                resetBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Projectile creation
        function createProjectile(car) {
            const isReverse = car.speed < 0;
            const radius = isReverse ? 4 : 10;
            const offset = isReverse ? -car.width/2 : car.width/2;
            return {
                x: car.x + Math.cos(car.angle) * offset,
                y: car.y + Math.sin(car.angle) * offset,
                dx: Math.cos(car.angle) * PROJECTILE_SPEED * (isReverse ? -1 : 1),
                dy: Math.sin(car.angle) * PROJECTILE_SPEED * (isReverse ? -1 : 1),
                life: 60,
                radius: radius,
                owner: car
            };
        }

        // Track creation
        function createTrack(x, y, angle) {
            return {
                x: x,
                y: y,
                angle: angle,
                life: TRACK_LIFE
            };
        }

        // Update car movement based on controls
        function updateCarControls(car) {
            if (car.isDestroyed) return;
            if (car === car1) {
                if (keys['ArrowLeft']) car.rotation = -ROTATION_SPEED;
                else if (keys['ArrowRight']) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['ArrowUp']) car.speed = car.maxSpeed;
                else if (keys['ArrowDown']) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }
            if (car === car2) {
                if (keys['a'] || keys['A']) car.rotation = -ROTATION_SPEED;
                else if (keys['d'] || keys['D']) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['w'] || keys['W']) car.speed = car.maxSpeed;
                else if (keys['s'] || keys['S']) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }

            if (car.speed > 0 && !car.wasDriving) {
                playSound(200, 0.2, 'sawtooth', 0.2);
                car.wasDriving = true;
                car.wasReverse = false;
            } else if (car.speed < 0 && !car.wasReverse) {
                playSound(150, 0.3, 'sawtooth', 0.2);
                car.wasReverse = true;
                car.wasDriving = false;
            } else if (car.speed === 0) {
                car.wasDriving = false;
                car.wasReverse = false;
            }
        }

        // Draw car function with bigger wheels
        function drawCar(car, color) {
            if (car.isDestroyed) return;
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            ctx.beginPath();
            ctx.moveTo(-car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, car.height/2);
            ctx.lineTo(-car.width/2, car.height/2);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(car.width/2 - 10, -car.height/2 - 5);
            ctx.lineTo(car.width/2 - 10, -car.height/2);
            ctx.stroke();

            // Bigger, taller wheels
            ctx.fillStyle = 'black';
            ctx.fillRect(-car.width/2 + 5, -car.height/2 - 8, 10, 16); // Left front
            ctx.fillRect(-car.width/2 + 5, car.height/2 - 8, 10, 16);  // Left rear
            ctx.fillRect(car.width/2 - 15, -car.height/2 - 8, 10, 16); // Right front
            ctx.fillRect(car.width/2 - 15, car.height/2 - 8, 10, 16);  // Right rear

            if (car.speed > 0) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            if (car.speed < 0) {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(-car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Draw speckled background
        function drawBackground() {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add speckles
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2 + 1;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Game loop
        function update() {
            drawBackground();

            // Update both cars
            [car1, car2].forEach(car => {
                updateCarControls(car);
                if (car.isDestroyed) return;
                car.angle += car.rotation;
                const newX = car.x + Math.cos(car.angle) * car.speed;
                const newY = car.y + Math.sin(car.angle) * car.speed;

                if (car.speed !== 0) {
                    tracks.push(createTrack(car.x, car.y, car.angle));
                }

                car.x = newX;
                car.y = newY;

                if (car.x < 0) car.x = canvas.width;
                if (car.x > canvas.width) car.x = 0;
                if (car.y < 0) car.y = canvas.height;
                if (car.y > canvas.height) car.y = 0;

                const dist = Math.hypot(car.x - ball.x, car.y - ball.y);
                if (dist < car.width/2 + ball.radius) {
                    const angleToBall = Math.atan2(ball.y - car.y, ball.x - car.x);
                    if (ball.isStuck) {
                        ball.isStuck = false;
                        ball.dy = car.y < ball.y ? 2 : -2;
                        ball.dx += Math.cos(angleToBall) * car.speed * 0.5;
                        playSound(300, 0.15, 'square', 0.3);
                    } else {
                        ball.dx += Math.cos(angleToBall) * car.speed * 0.5;
                        ball.dy += Math.sin(angleToBall) * car.speed * 0.5;
                        playSound(300, 0.15, 'square', 0.3);
                        const otherCar = car === car1 ? car2 : car1;
                        if (otherCar.isDestroyed) {
                            respawnCar(otherCar);
                        }
                    }
                }
            });

            // Update ball
            if (!ball.isStuck) {
                ball.x += ball.dx;
                ball.y += ball.dy;
                ball.dx *= ball.friction;
                ball.dy *= ball.friction;

                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.dx = -ball.dx * 0.8;
                }
                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.dx = -ball.dx * 0.8;
                }
                if (ball.y - ball.radius < barrier.height) {
                    ball.y = barrier.height + ball.radius;
                    ball.dy = -ball.dy * 0.8;
                }
                if (ball.y + ball.radius > canvas.height) {
                    ball.y = canvas.height - ball.radius;
                    ball.dy = -ball.dy * 0.8;
                }

                if (ball.x > hoop.x - hoop.width/2 && 
                    ball.x < hoop.x + hoop.width/2 && 
                    ball.y > hoop.y - ball.radius && 
                    ball.y < hoop.y + hoop.netHeight && 
                    ball.dy > 0 && !ball.isStuck) {
                    ball.isStuck = true;
                    ball.x = hoop.x;
                    ball.y = hoop.y + hoop.netHeight/2;
                    ball.dx = 0;
                    ball.dy = 0;
                    const lastTouch = projectiles.length > 0 && projectiles[projectiles.length-1].owner ? 
                        projectiles[projectiles.length-1].owner : 
                        (Math.hypot(car1.x - ball.x, car1.y - ball.y) < Math.hypot(car2.x - ball.x, car2.y - ball.y) ? car1 : car2);
                    lastTouch.score++;
                    console.log('Score!', lastTouch === car1 ? 'Player 1' : 'Player 2');
                }
            }

            // Draw metal barrier
            ctx.fillStyle = 'silver';
            ctx.fillRect(barrier.x, barrier.y, barrier.width, barrier.height);

            // Draw tire tracks
            tracks.forEach((track, index) => {
                track.life--;
                if (track.life <= 0) {
                    tracks.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.translate(track.x, track.y);
                ctx.rotate(track.angle);
                ctx.fillStyle = `rgba(0, 0, 0, ${track.life / TRACK_LIFE})`;
                ctx.fillRect(-car1.width/2 + 5, -car1.height/2 - 2, 8, 2);
                ctx.fillRect(-car1.width/2 + 5, car1.height/2, 8, 2);
                ctx.restore();
            });

            // Draw both cars
            drawCar(car1, 'orange');
            drawCar(car2, 'blue');

            // Draw basketball hoop
            ctx.fillStyle = 'gray';
            ctx.fillRect(hoop.x - hoop.width/2, hoop.y - hoop.rimThickness, hoop.width, hoop.rimThickness);
            ctx.strokeStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.width/2, hoop.y);
            ctx.lineTo(hoop.x - hoop.width/2, hoop.y + hoop.netHeight);
            ctx.moveTo(hoop.x + hoop.width/2, hoop.y);
            ctx.lineTo(hoop.x + hoop.width/2, hoop.y + hoop.netHeight);
            ctx.stroke();

            // Draw basketball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF4500';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Update and draw projectiles
            projectiles.forEach((projectile, pIndex) => {
                projectile.x += projectile.dx;
                projectile.y += projectile.dy;
                projectile.life--;

                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                const distToBall = Math.hypot(projectile.x - ball.x, projectile.y - ball.y);
                if (distToBall < projectile.radius + ball.radius) {
                    const angleToBall = Math.atan2(ball.y - projectile.y, ball.x - projectile.x);
                    const impactFactor = projectile.radius / ball.radius;
                    if (!ball.isStuck) {
                        ball.dx += Math.cos(angleToBall) * PROJECTILE_SPEED * impactFactor * 0.1;
                        ball.dy += Math.sin(angleToBall) * PROJECTILE_SPEED * impactFactor * 0.1;
                    }
                    projectile.dx = -projectile.dx * 0.8;
                    projectile.dy = -projectile.dy * 0.8;
                    playSound(400, 0.1, 'sine', 0.2);
                }

                const otherCar = projectile.owner === car1 ? car2 : car1;
                const distToCar = Math.hypot(projectile.x - otherCar.x, projectile.y - otherCar.y);
                if (distToCar < projectile.radius + otherCar.width/2 && !otherCar.isDestroyed) {
                    if (projectile.radius === 10) {
                        otherCar.isDestroyed = true;
                        playSound(100, 0.5, 'sawtooth', 0.4);
                    } else {
                        playSound(500, 0.1, 'triangle', 0.3);
                    }
                    projectiles.splice(pIndex, 1);
                    return;
                }

                if (projectile.life <= 0) projectiles.splice(pIndex, 1);
            });

            // Draw scores and text with adjusted positions
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(5, 55, 100, 25); // P1 score background, moved down
            ctx.fillRect(canvas.width - 105, 55, 100, 25); // P2 score background, moved down
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText(`P1 Score: ${car1.score}`, 10, 75); // Moved down to avoid controls
            ctx.fillText(`P2 Score: ${car2.score}`, canvas.width - 100, 75); // Moved down and fits within green

            requestAnimationFrame(update);
        }

        // Start game
        update();
    </script>
</body>
</html>
