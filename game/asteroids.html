<!DOCTYPE html>
<html>
<head>
    <title>Asteroids Clone - RC Car Version</title>
    <style>
        canvas {
            border: 1px solid black;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // RC car object
        const car = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false
        };

        // Game variables
        let rocks = [];       // Changed from asteroids
        let projectiles = []; // Changed from bullets
        let particles = [];   // New particle array for explosions
        let tracks = [];
        const ROCK_COUNT = 5;
        const ROCK_SPEED = 1; // Reduced speed since they're heavy
        const ROTATION_SPEED = 0.1;
        const PROJECTILE_SPEED = 5;
        const TRACK_LIFE = 120;
        const PARTICLE_LIFE = 60;

        // Controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': car.rotation = -ROTATION_SPEED; break;
                case 'ArrowRight': car.rotation = ROTATION_SPEED; break;
                case 'ArrowUp': car.speed = car.maxSpeed; break;
                case 'ArrowDown': car.speed = -car.maxSpeed/2; break;
                case ' ': 
                    projectiles.push(createProjectile()); 
                    car.isShooting = true;
                    setTimeout(() => car.isShooting = false, 100);
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                case 'ArrowRight': car.rotation = 0; break;
                case 'ArrowUp':
                case 'ArrowDown': car.speed = 0; break;
            }
        });

        // Rock creation
        function createRock() {
            const size = 20 + Math.random() * 30;
            return {
                x: Math.random() * canvas.width,
                y: canvas.height - size, // Start on ground
                radius: size,
                dx: (Math.random() - 0.5) * ROCK_SPEED,
                dy: 0 // No vertical movement since they're heavy
            };
        }

        // Projectile (rock) creation
        function createProjectile() {
            return {
                x: car.x + Math.cos(car.angle) * car.width/2,
                y: car.y + Math.sin(car.angle) * car.width/2,
                dx: Math.cos(car.angle) * PROJECTILE_SPEED,
                dy: Math.sin(car.angle) * PROJECTILE_SPEED,
                life: 60,
                radius: 4 // Larger than bullets for rock appearance
            };
        }

        // Particle creation for explosions
        function createParticles(x, y, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 3,
                    dy: (Math.random() - 0.5) * 3,
                    life: PARTICLE_LIFE,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Track creation
        function createTrack(x, y, angle) {
            return {
                x: x,
                y: y,
                angle: angle,
                life: TRACK_LIFE
            };
        }

        // Initialize rocks
        for (let i = 0; i < ROCK_COUNT; i++) {
            rocks.push(createRock());
        }

        // Game loop
        function update() {
            // Clear canvas with green background
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update car
            car.angle += car.rotation;
            const newX = car.x + Math.cos(car.angle) * car.speed;
            const newY = car.y + Math.sin(car.angle) * car.speed;

            if (car.speed !== 0) {
                tracks.push(createTrack(car.x, car.y, car.angle));
            }

            car.x = newX;
            car.y = newY;

            // Screen wrap for car
            if (car.x < 0) car.x = canvas.width;
            if (car.x > canvas.width) car.x = 0;
            if (car.y < 0) car.y = canvas.height;
            if (car.y > canvas.height) car.y = 0;

            // Draw tire tracks
            tracks.forEach((track, index) => {
                track.life--;
                if (track.life <= 0) {
                    tracks.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.translate(track.x, track.y);
                ctx.rotate(track.angle);
                ctx.fillStyle = `rgba(0, 0, 0, ${track.life / TRACK_LIFE})`;
                ctx.fillRect(-car.width/2 + 5, -car.height/2 - 2, 8, 2);
                ctx.fillRect(-car.width/2 + 5, car.height/2, 8, 2);
                ctx.restore();
            });

            // Draw RC car (now orange)
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Car body with spoiler
            ctx.beginPath();
            ctx.moveTo(-car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, car.height/2);
            ctx.lineTo(-car.width/2, car.height/2);
            ctx.closePath();
            ctx.fillStyle = 'orange'; // Changed to orange
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Spoiler
            ctx.beginPath();
            ctx.moveTo(car.width/2 - 10, -car.height/2 - 5);
            ctx.lineTo(car.width/2 - 10, -car.height/2);
            ctx.stroke();

            // Wheels
            ctx.fillStyle = 'black';
            ctx.fillRect(-car.width/2 + 5, -car.height/2 - 4, 8, 4);
            ctx.fillRect(-car.width/2 + 5, car.height/2, 8, 4);
            ctx.fillRect(car.width/2 - 13, -car.height/2 - 4, 8, 4);
            ctx.fillRect(car.width/2 - 13, car.height/2, 8, 4);

            // Forward lights (yellow)
            if (car.speed > 0) {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Reverse lights (red)
            if (car.speed < 0) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(-car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            // Update and draw rocks
            rocks.forEach((rock, index) => {
                rock.x += rock.dx;
                // No vertical movement (dy = 0)

                // Screen wrap for rocks
                if (rock.x < 0) rock.x = canvas.width;
                if (rock.x > canvas.width) rock.x = 0;

                // Draw rock with rough edges
                ctx.beginPath();
                ctx.moveTo(rock.x + rock.radius, rock.y);
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = rock.radius * (0.8 + Math.random() * 0.4);
                    ctx.lineTo(
                        rock.x + Math.cos(angle) * r,
                        rock.y + Math.sin(angle) * r
                    );
                }
                ctx.closePath();
                ctx.fillStyle = 'gray';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();

                // Collision with car
                const dist = Math.hypot(car.x - rock.x, car.y - rock.y);
                if (dist < car.width/2 + rock.radius) {
                    createParticles(rock.x, rock.y);
                    rocks.splice(index, 1);
                    rocks.push(createRock());
                    console.log('Rock smashed!');
                }
            });

            // Update and draw projectiles (small rocks)
            projectiles.forEach((projectile, pIndex) => {
                projectile.x += projectile.dx;
                projectile.y += projectile.dy;
                projectile.life--;

                // Draw as small irregular rock
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'gray';
                ctx.fill();

                // Check projectile-rock collision
                rocks.forEach((rock, rIndex) => {
                    const dist = Math.hypot(projectile.x - rock.x, projectile.y - rock.y);
                    if (dist < rock.radius + projectile.radius) {
                        createParticles(rock.x, rock.y);
                        rocks.splice(rIndex, 1);
                        projectiles.splice(pIndex, 1);
                        rocks.push(createRock());
                    }
                });

                if (projectile.life <= 0) projectiles.splice(pIndex, 1);
            });

            // Update and draw particles
            particles.forEach((particle, index) => {
                particle.x += particle.dx;
                particle.y += particle.dy;
                particle.life--;

                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(128, 128, 128, ${particle.life / PARTICLE_LIFE})`;
                ctx.fill();

                if (particle.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(update);
        }

        // Start game
        update();
    </script>
</body>
</html>
