<!DOCTYPE html>
<html>
<head>
    <title>Asteroids Clone - RC Car Version</title>
    <style>
        canvas {
            border: 1px solid black;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // RC car object
        const car = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 40,  // Slightly longer
            height: 20, // Slightly taller
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false
        };

        // Game variables
        let asteroids = [];
        let bullets = [];
        const ASTEROID_COUNT = 5;
        const ASTEROID_SPEED = 2;
        const ROTATION_SPEED = 0.1;
        const BULLET_SPEED = 5;

        // Controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': car.rotation = -ROTATION_SPEED; break;
                case 'ArrowRight': car.rotation = ROTATION_SPEED; break;
                case 'ArrowUp': car.speed = car.maxSpeed; break;
                case 'ArrowDown': car.speed = -car.maxSpeed/2; break;
                case ' ': 
                    bullets.push(createBullet()); 
                    car.isShooting = true;
                    setTimeout(() => car.isShooting = false, 100); // Brief flash
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                case 'ArrowRight': car.rotation = 0; break;
                case 'ArrowUp':
                case 'ArrowDown': car.speed = 0; break;
            }
        });

        // Asteroid creation
        function createAsteroid() {
            const size = 20 + Math.random() * 30;
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: size,
                dx: (Math.random() - 0.5) * ASTEROID_SPEED,
                dy: (Math.random() - 0.5) * ASTEROID_SPEED
            };
        }

        // Bullet creation
        function createBullet() {
            return {
                x: car.x + Math.cos(car.angle) * car.width/2,
                y: car.y + Math.sin(car.angle) * car.width/2,
                dx: Math.cos(car.angle) * BULLET_SPEED,
                dy: Math.sin(car.angle) * BULLET_SPEED,
                life: 60
            };
        }

        // Initialize asteroids
        for (let i = 0; i < ASTEROID_COUNT; i++) {
            asteroids.push(createAsteroid());
        }

        // Game loop
        function update() {
            // Clear canvas with green background
            ctx.fillStyle = '#228B22'; // Forest green
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update car
            car.angle += car.rotation;
            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            // Screen wrap for car
            if (car.x < 0) car.x = canvas.width;
            if (car.x > canvas.width) car.x = 0;
            if (car.y < 0) car.y = canvas.height;
            if (car.y > canvas.height) car.y = 0;

            // Draw RC car
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Car body with spoiler
            ctx.beginPath();
            ctx.moveTo(-car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, car.height/2);
            ctx.lineTo(-car.width/2, car.height/2);
            ctx.closePath();
            ctx.fillStyle = 'red'; // Red car body
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Spoiler
            ctx.beginPath();
            ctx.moveTo(car.width/2 - 10, -car.height/2 - 5);
            ctx.lineTo(car.width/2 - 10, -car.height/2);
            ctx.stroke();

            // Wheels
            ctx.fillStyle = 'black';
            ctx.fillRect(-car.width/2 + 5, -car.height/2 - 4, 8, 4);  // Top left wheel
            ctx.fillRect(-car.width/2 + 5, car.height/2, 8, 4);      // Bottom left wheel
            ctx.fillRect(car.width/2 - 13, -car.height/2 - 4, 8, 4); // Top right wheel
            ctx.fillRect(car.width/2 - 13, car.height/2, 8, 4);      // Bottom right wheel

            // Headlights (only when moving forward or shooting)
            if (car.speed > 0 || car.isShooting) {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2); // Right headlight
                ctx.fill();
                ctx.beginPath();
                ctx.arc(car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);  // Left headlight
                ctx.fill();
            }

            ctx.restore();

            // Update and draw asteroids
            asteroids.forEach((asteroid, index) => {
                asteroid.x += asteroid.dx;
                asteroid.y += asteroid.dy;

                // Screen wrap for asteroids
                if (asteroid.x < 0) asteroid.x = canvas.width;
                if (asteroid.x > canvas.width) asteroid.x = 0;
                if (asteroid.y < 0) asteroid.y = canvas.height;
                if (asteroid.y > canvas.height) asteroid.y = 0;

                // Draw asteroid
                ctx.beginPath();
                ctx.arc(asteroid.x, asteroid.y, asteroid.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'white';
                ctx.stroke();

                // Collision with car
                const dist = Math.hypot(car.x - asteroid.x, car.y - asteroid.y);
                if (dist < car.width/2 + asteroid.radius) {
                    console.log('Collision!');
                }
            });

            // Update and draw bullets
            bullets.forEach((bullet, bIndex) => {
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                bullet.life--;

                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                // Check bullet-asteroid collision
                asteroids.forEach((asteroid, aIndex) => {
                    const dist = Math.hypot(bullet.x - asteroid.x, bullet.y - asteroid.y);
                    if (dist < asteroid.radius) {
                        asteroids.splice(aIndex, 1);
                        bullets.splice(bIndex, 1);
                        asteroids.push(createAsteroid());
                    }
                });

                if (bullet.life <= 0) bullets.splice(bIndex, 1);
            });

            requestAnimationFrame(update);
        }

        // Start game
        update();
    </script>
</body>
</html>
