<!DOCTYPE html>
<html>
<head>
    <title>Asteroids Clone - 2 Player RC Car Version</title>
    <style>
        canvas {
            border: 1px solid black;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player 1 RC car (orange)
        const car1 = {
            x: canvas.width / 4,
            y: canvas.height / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false
        };

        // Player 2 RC car (blue)
        const car2 = {
            x: 3 * canvas.width / 4,
            y: canvas.height / 2,
            width: 40,
            height: 20,
            angle: 0,
            rotation: 0,
            speed: 0,
            maxSpeed: 3,
            isShooting: false
        };

        // Game variables
        let rocks = [];
        let projectiles = [];
        let particles = [];
        let tracks = [];
        const ROCK_COUNT = 5;
        const ROTATION_SPEED = 0.1;
        const PROJECTILE_SPEED = 5;
        const TRACK_LIFE = 120;
        const PARTICLE_LIFE = 60;

        // Controls for both players
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            // Player 1 shooting
            if (e.key === ' ') {
                projectiles.push(createProjectile(car1));
                car1.isShooting = true;
                setTimeout(() => car1.isShooting = false, 100);
            }
            // Player 2 shooting
            if (e.key === 'q' || e.key === 'Q') {
                projectiles.push(createProjectile(car2));
                car2.isShooting = true;
                setTimeout(() => car2.isShooting = false, 100);
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Rock creation (stationary)
        function createRock() {
            const size = 20 + Math.random() * 30;
            return {
                x: Math.random() * canvas.width,
                y: canvas.height - size,
                radius: size,
                dx: 0,
                dy: 0
            };
        }

        // Projectile (rock) creation
        function createProjectile(car) {
            return {
                x: car.x + Math.cos(car.angle) * car.width/2,
                y: car.y + Math.sin(car.angle) * car.width/2,
                dx: Math.cos(car.angle) * PROJECTILE_SPEED,
                dy: Math.sin(car.angle) * PROJECTILE_SPEED,
                life: 60,
                radius: 4,
                owner: car // Track which car shot it
            };
        }

        // Particle creation for explosions
        function createParticles(x, y, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 3,
                    dy: (Math.random() - 0.5) * 3,
                    life: PARTICLE_LIFE,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Track creation
        function createTrack(x, y, angle) {
            return {
                x: x,
                y: y,
                angle: angle,
                life: TRACK_LIFE
            };
        }

        // Initialize rocks
        for (let i = 0; i < ROCK_COUNT; i++) {
            rocks.push(createRock());
        }

        // Update car movement based on controls
        function updateCarControls(car) {
            // Player 1 controls
            if (car === car1) {
                if (keys['ArrowLeft']) car.rotation = -ROTATION_SPEED;
                else if (keys['ArrowRight']) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['ArrowUp']) car.speed = car.maxSpeed;
                else if (keys['ArrowDown']) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }
            // Player 2 controls
            if (car === car2) {
                if (keys['a'] || keys['A']) car.rotation = -ROTATION_SPEED;
                else if (keys['d'] || keys['D']) car.rotation = ROTATION_SPEED;
                else car.rotation = 0;
                if (keys['w'] || keys['W']) car.speed = car.maxSpeed;
                else if (keys['s'] || keys['S']) car.speed = -car.maxSpeed/2;
                else car.speed = 0;
            }
        }

        // Draw car function
        function drawCar(car, color) {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Car body with spoiler
            ctx.beginPath();
            ctx.moveTo(-car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, -car.height/2);
            ctx.lineTo(car.width/2, car.height/2);
            ctx.lineTo(-car.width/2, car.height/2);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Spoiler
            ctx.beginPath();
            ctx.moveTo(car.width/2 - 10, -car.height/2 - 5);
            ctx.lineTo(car.width/2 - 10, -car.height/2);
            ctx.stroke();

            // Wheels
            ctx.fillStyle = 'black';
            ctx.fillRect(-car.width/2 + 5, -car.height/2 - 4, 8, 4);
            ctx.fillRect(-car.width/2 + 5, car.height/2, 8, 4);
            ctx.fillRect(car.width/2 - 13, -car.height/2 - 4, 8, 4);
            ctx.fillRect(car.width/2 - 13, car.height/2, 8, 4);

            // Forward lights (red)
            if (car.speed > 0) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Reverse lights (yellow)
            if (car.speed < 0) {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(-car.width/2, -car.height/2 + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-car.width/2, car.height/2 - 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Game loop
        function update() {
            // Clear canvas with green background
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update both cars
            [car1, car2].forEach(car => {
                updateCarControls(car);
                car.angle += car.rotation;
                const newX = car.x + Math.cos(car.angle) * car.speed;
                const newY = car.y + Math.sin(car.angle) * car.speed;

                if (car.speed !== 0) {
                    tracks.push(createTrack(car.x, car.y, car.angle));
                }

                car.x = newX;
                car.y = newY;

                // Screen wrap for car
                if (car.x < 0) car.x = canvas.width;
                if (car.x > canvas.width) car.x = 0;
                if (car.y < 0) car.y = canvas.height;
                if (car.y > canvas.height) car.y = 0;
            });

            // Draw tire tracks
            tracks.forEach((track, index) => {
                track.life--;
                if (track.life <= 0) {
                    tracks.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.translate(track.x, track.y);
                ctx.rotate(track.angle);
                ctx.fillStyle = `rgba(0, 0, 0, ${track.life / TRACK_LIFE})`;
                ctx.fillRect(-car1.width/2 + 5, -car1.height/2 - 2, 8, 2);
                ctx.fillRect(-car1.width/2 + 5, car1.height/2, 8, 2);
                ctx.restore();
            });

            // Draw both cars
            drawCar(car1, 'orange');  // Player 1
            drawCar(car2, 'blue');    // Player 2

            // Update and draw rocks
            rocks.forEach((rock, index) => {
                // Draw rock with rough edges
                ctx.beginPath();
                ctx.moveTo(rock.x + rock.radius, rock.y);
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = rock.radius * (0.8 + Math.random() * 0.4);
                    ctx.lineTo(
                        rock.x + Math.cos(angle) * r,
                        rock.y + Math.sin(angle) * r
                    );
                }
                ctx.closePath();
                ctx.fillStyle = 'gray';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();

                // Collision with either car
                [car1, car2].forEach(car => {
                    const dist = Math.hypot(car.x - rock.x, car.y - rock.y);
                    if (dist < car.width/2 + rock.radius) {
                        createParticles(rock.x, rock.y);
                        rocks.splice(index, 1);
                        rocks.push(createRock());
                        console.log('Rock smashed!');
                    }
                });
            });

            // Update and draw projectiles
            projectiles.forEach((projectile, pIndex) => {
                projectile.x += projectile.dx;
                projectile.y += projectile.dy;
                projectile.life--;

                // Draw as small white rock
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                // Check projectile-rock collision
                rocks.forEach((rock, rIndex) => {
                    const dist = Math.hypot(projectile.x - rock.x, projectile.y - rock.y);
                    if (dist < rock.radius + projectile.radius) {
                        createParticles(rock.x, rock.y);
                        rocks.splice(rIndex, 1);
                        projectiles.splice(pIndex, 1);
                        rocks.push(createRock());
                    }
                });

                if (projectile.life <= 0) projectiles.splice(pIndex, 1);
            });

            // Update and draw particles
            particles.forEach((particle, index) => {
                particle.x += particle.dx;
                particle.y += particle.dy;
                particle.life--;

                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(128, 128, 128, ${particle.life / PARTICLE_LIFE})`;
                ctx.fill();

                if (particle.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(update);
        }

        // Start game
        update();
    </script>
</body>
</html>
