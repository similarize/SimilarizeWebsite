<!DOCTYPE html>
<html>
<head>
    <title>Book of Mormon Lands with Label Toggle</title>
    <!-- Comprehensive CSP that addresses all issues -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://maps.google.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com data:; connect-src 'self' https://www.similarize.com; font-src 'self'; frame-src 'self';">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        #toggleButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        #loadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 5px;
            z-index: 2;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <button id="toggleButton">Show Modern Labels</button>
    <div id="map"></div>
    <div id="loadingMessage">Loading map data...</div>

    <script>
        // Avoid external XML parser dependencies entirely
        // Use browser's built-in XML parsing capabilities
        let map;
        let labelsVisible = false;

        // Native KML parser that doesn't rely on external libraries
        function parseKMLWithDOM(kmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(kmlText, "text/xml");
            const placemarks = xmlDoc.getElementsByTagName("Placemark");
            const result = [];
            
            for (let i = 0; i < placemarks.length; i++) {
                const pm = placemarks[i];
                const placemark = {
                    name: pm.getElementsByTagName("name")[0]?.textContent || "",
                    type: null,
                    coordinates: null
                };
                
                // Check for Point
                if (pm.getElementsByTagName("Point").length > 0) {
                    placemark.type = "Point";
                    const coordText = pm.getElementsByTagName("Point")[0]
                        .getElementsByTagName("coordinates")[0]?.textContent || "";
                    placemark.coordinates = coordText;
                }
                
                // Check for Polygon
                if (pm.getElementsByTagName("Polygon").length > 0) {
                    placemark.type = "Polygon";
                    const coordText = pm.getElementsByTagName("Polygon")[0]
                        .getElementsByTagName("outerBoundaryIs")[0]
                        .getElementsByTagName("LinearRing")[0]
                        .getElementsByTagName("coordinates")[0]?.textContent || "";
                    placemark.coordinates = coordText;
                }
                
                // Check for LineString
                if (pm.getElementsByTagName("LineString").length > 0) {
                    placemark.type = "LineString";
                    const coordText = pm.getElementsByTagName("LineString")[0]
                        .getElementsByTagName("coordinates")[0]?.textContent || "";
                    placemark.coordinates = coordText;
                }
                
                result.push(placemark);
            }
            
            return result;
        }
        
        function parsePointCoordinates(coordsString) {
            const parts = coordsString.trim().split(",");
            if (parts.length >= 2) {
                return { 
                    lng: parseFloat(parts[0]), 
                    lat: parseFloat(parts[1])
                };
            }
            return null;
        }
        
        function parsePolylineCoordinates(coordsString) {
            return coordsString.trim().split(/\s+/).map(coord => {
                const [lng, lat] = coord.split(",");
                return { 
                    lat: parseFloat(lat), 
                    lng: parseFloat(lng)
                };
            });
        }

        // Wait for Google Maps to load
        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 17.5, lng: -89.5 },
                zoom: 7,
                mapTypeId: "satellite",
                disableDefaultUI: true
            });

            fetch("https://www.similarize.com/game/book_of_mormon_lands.kml")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch KML: " + response.status);
                    return response.text();
                })
                .then(kmlText => {
                    const placemarks = parseKMLWithDOM(kmlText);
                    console.log("KML parsed successfully", placemarks);
                    
                    placemarks.forEach(placemark => {
                        const name = placemark.name;
                        
                        if (placemark.type === "Point") {
                            const position = parsePointCoordinates(placemark.coordinates);
                            if (position) {
                                new google.maps.Marker({
                                    position,
                                    map,
                                    label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                    icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                                });
                            }
                        }
                        
                        if (placemark.type === "Polygon") {
                            const coords = parsePolylineCoordinates(placemark.coordinates);
                            
                            if (coords.length > 2) {
                                new google.maps.Polygon({
                                    paths: coords,
                                    strokeColor: "#FF0000",
                                    strokeOpacity: 0.8,
                                    strokeWeight: 2,
                                    fillColor: "#FF0000",
                                    fillOpacity: 0.35,
                                    map
                                });
                                
                                const bounds = new google.maps.LatLngBounds();
                                coords.forEach(coord => bounds.extend(coord));
                                const center = bounds.getCenter();
                                
                                new google.maps.Marker({
                                    position: center,
                                    map,
                                    label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                    icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                                });
                            }
                        }
                        
                        if (placemark.type === "LineString") {
                            const coords = parsePolylineCoordinates(placemark.coordinates);
                            
                            if (coords.length > 1) {
                                new google.maps.Polyline({
                                    path: coords,
                                    strokeColor: "#0000FF",
                                    strokeOpacity: 1.0,
                                    strokeWeight: 3,
                                    map
                                });
                                
                                const midIndex = Math.floor(coords.length / 2);
                                const midPoint = coords[midIndex];
                                
                                new google.maps.Marker({
                                    position: midPoint,
                                    map,
                                    label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                    icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                                });
                            }
                        }
                    });
                    
                    // Hide loading message
                    document.getElementById("loadingMessage").style.display = "none";
                })
                .catch(error => {
                    console.error("Error loading or parsing KML:", error);
                    document.getElementById("loadingMessage").textContent = "Error loading map data. Please try again.";
                });

            const toggleButton = document.getElementById("toggleButton");
            toggleButton.addEventListener("click", function() {
                labelsVisible = !labelsVisible;
                map.setMapTypeId(labelsVisible ? "hybrid" : "satellite");
                toggleButton.textContent = labelsVisible ? "Hide Modern Labels" : "Show Modern Labels";
                console.log("Toggled to:", map.getMapTypeId());
            });
        }
    </script>

</html>
