<!DOCTYPE html>
<html>
<head>
    <title>Book of Mormon Lands with Label Toggle</title>
    <!-- Add CSP meta tag to allow unsafe-eval only for this page -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://maps.googleapis.com; connect-src 'self' https://www.similarize.com;">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        #toggleButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
    <!-- Updated CDN path for xml2js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xml2js/0.6.2/xml2js.min.js"></script>
</head>
<body>
    <button id="toggleButton">Show Modern Labels</button>
    <div id="map"></div>

    <script>
        let map;
        let labelsVisible = false;

        // Alternative approach: Use a different XML parser
        // This function will parse KML without using xml2js if it fails
        function parseKML(kmlText) {
            return new Promise((resolve, reject) => {
                try {
                    // Try to use xml2js if available
                    if (typeof window.xml2js !== "undefined") {
                        const parser = new window.xml2js.Parser();
                        parser.parseString(kmlText, (err, result) => {
                            if (err) throw err;
                            resolve(result);
                        });
                    } else {
                        // Fallback to DOM parser if xml2js is unavailable or blocked
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(kmlText, "text/xml");
                        const placemarks = xmlDoc.getElementsByTagName("Placemark");
                        
                        // Create a structure similar to what xml2js would produce
                        const result = {
                            kml: {
                                Document: [{
                                    Placemark: Array.from(placemarks).map(pm => {
                                        const placemark = {
                                            name: [pm.getElementsByTagName("name")[0]?.textContent || ""]
                                        };
                                        
                                        if (pm.getElementsByTagName("Point").length > 0) {
                                            placemark.Point = [{
                                                coordinates: [pm.getElementsByTagName("Point")[0]
                                                    .getElementsByTagName("coordinates")[0]?.textContent || ""]
                                            }];
                                        }
                                        
                                        if (pm.getElementsByTagName("Polygon").length > 0) {
                                            placemark.Polygon = [{
                                                outerBoundaryIs: [{
                                                    LinearRing: [{
                                                        coordinates: [pm.getElementsByTagName("Polygon")[0]
                                                            .getElementsByTagName("outerBoundaryIs")[0]
                                                            .getElementsByTagName("LinearRing")[0]
                                                            .getElementsByTagName("coordinates")[0]?.textContent || ""]
                                                    }]
                                                }]
                                            }];
                                        }
                                        
                                        if (pm.getElementsByTagName("LineString").length > 0) {
                                            placemark.LineString = [{
                                                coordinates: [pm.getElementsByTagName("LineString")[0]
                                                    .getElementsByTagName("coordinates")[0]?.textContent || ""]
                                            }];
                                        }
                                        
                                        return placemark;
                                    })
                                }]
                            }
                        };
                        
                        resolve(result);
                    }
                } catch (error) {
                    reject(error);
                }
            });
        }

        // Wait for Google Maps to load
        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 17.5, lng: -89.5 },
                zoom: 7,
                mapTypeId: "satellite",
                disableDefaultUI: true
            });

            fetch("https://www.similarize.com/game/book_of_mormon_lands.kml")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch KML: " + response.status);
                    return response.text();
                })
                .then(kmlText => {
                    return parseKML(kmlText);
                })
                .then(result => {
                    console.log("KML parsed successfully");
                    const placemarks = result.kml.Document[0].Placemark;

                    placemarks.forEach(placemark => {
                        const name = placemark.name[0];

                        if (placemark.Point) {
                            const coords = placemark.Point[0].coordinates[0].split(",").map(Number);
                            const position = { lng: coords[0], lat: coords[1] };
                            new google.maps.Marker({
                                position,
                                map,
                                label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                            });
                        }

                        if (placemark.Polygon) {
                            const coords = placemark.Polygon[0].outerBoundaryIs[0].LinearRing[0].coordinates[0]
                                .trim().split(/\s+/).map(coord => {
                                    const [lng, lat] = coord.split(",").map(Number);
                                    return { lat, lng };
                                });

                            new google.maps.Polygon({
                                paths: coords,
                                strokeColor: "#FF0000",
                                strokeOpacity: 0.8,
                                strokeWeight: 2,
                                fillColor: "#FF0000",
                                fillOpacity: 0.35,
                                map
                            });

                            const bounds = new google.maps.LatLngBounds();
                            coords.forEach(coord => bounds.extend(coord));
                            const center = bounds.getCenter();

                            new google.maps.Marker({
                                position: center,
                                map,
                                label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                            });
                        }

                        if (placemark.LineString) {
                            const coords = placemark.LineString[0].coordinates[0]
                                .trim().split(/\s+/).map(coord => {
                                    const [lng, lat] = coord.split(",").map(Number);
                                    return { lat, lng };
                                });

                            new google.maps.Polyline({
                                path: coords,
                                strokeColor: "#0000FF",
                                strokeOpacity: 1.0,
                                strokeWeight: 3,
                                map
                            });

                            const midIndex = Math.floor(coords.length / 2);
                            const midPoint = coords[midIndex];

                            new google.maps.Marker({
                                position: midPoint,
                                map,
                                label: { text: name, color: "#ffffff", fontSize: "14px", fontWeight: "bold" },
                                icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", labelOrigin: new google.maps.Point(10, -10) }
                            });
                        }
                    });
                })
                .catch(error => console.error("Error loading or parsing KML:", error));

            const toggleButton = document.getElementById("toggleButton");
            toggleButton.addEventListener("click", () => {
                labelsVisible = !labelsVisible;
                map.setMapTypeId(labelsVisible ? "hybrid" : "satellite");
                toggleButton.textContent = labelsVisible ? "Hide Modern Labels" : "Show Modern Labels";
                console.log("Toggled to:", map.getMapTypeId());
            });
        }
    </script>
