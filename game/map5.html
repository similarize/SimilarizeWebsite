<!DOCTYPE html>
<html>
<head>
    <title>Book of Mormon Lands with Label Toggle</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        #toggleButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>

<body>
    <button id="toggleButton">Show Modern Labels</button>
    <div id="map"></div>

    <script>
        let map;
        let labelsVisible = false;

        function initMap() {
            if (typeof xml2js === "undefined") {
                console.error("xml2js is somehow undefined despite being inlined. This shouldn’t happen!");
                return;
            }
            console.log("xml2js loaded successfully (inlined)");

            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 17.5, lng: -89.5 }, // Centered on your region
                zoom: 7,
                mapTypeId: "satellite",
                disableDefaultUI: true
            });

            fetch("https://www.similarize.com/game/book_of_mormon_lands.kml")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch KML: " + response.status);
                    return response.text();
                })
                .then(kmlText => {
                    xml2js.parseString(kmlText, (err, result) => {
                        if (err) throw new Error("Failed to parse KML: " + err);

                        const placemarks = result.kml.Document[0].Placemark;

                        placemarks.forEach(placemark => {
                            const name = placemark.name[0];

                            if (placemark.Point) {
                                const coords = placemark.Point[0].coordinates[0].split(",").map(Number);
                                const position = { lng: coords[0], lat: coords[1] };
                                new google.maps.Marker({
                                    position,
                                    map: map,
                                    label: {
                                        text: name,
                                        color: "#ffffff",
                                        fontSize: "14px",
                                        fontWeight: "bold"
                                    },
                                    icon: {
                                        url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
                                        labelOrigin: new google.maps.Point(10, -10)
                                    }
                                });
                            }

                            if (placemark.Polygon) {
                                const coords = placemark.Polygon[0].outerBoundaryIs[0].LinearRing[0].coordinates[0]
                                    .trim().split(/\s+/).map(coord => {
                                        const [lng, lat] = coord.split(",").map(Number);
                                        return { lat, lng };
                                    });

                                const poly = new google.maps.Polygon({
                                    paths: coords,
                                    strokeColor: "#FF0000",
                                    strokeOpacity: 0.8,
                                    strokeWeight: 2,
                                    fillColor: "#FF0000",
                                    fillOpacity: 0.35,
                                    map: map
                                });

                                const bounds = new google.maps.LatLngBounds();
                                coords.forEach(coord => bounds.extend(coord));
                                const center = bounds.getCenter();

                                new google.maps.Marker({
                                    position: center,
                                    map: map,
                                    label: {
                                        text: name,
                                        color: "#ffffff",
                                        fontSize: "14px",
                                        fontWeight: "bold"
                                    },
                                    icon: {
                                        url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
                                        labelOrigin: new google.maps.Point(10, -10)
                                    }
                                });
                            }

                            if (placemark.LineString) {
                                const coords = placemark.LineString[0].coordinates[0]
                                    .trim().split(/\s+/).map(coord => {
                                        const [lng, lat] = coord.split(",").map(Number);
                                        return { lat, lng };
                                    });

                                const polyline = new google.maps.Polyline({
                                    path: coords,
                                    strokeColor: "#0000FF",
                                    strokeOpacity: 1.0,
                                    strokeWeight: 3,
                                    map: map
                                });

                                const midIndex = Math.floor(coords.length / 2);
                                const midPoint = coords[midIndex];

                                new google.maps.Marker({
                                    position: midPoint,
                                    map: map,
                                    label: {
                                        text: name,
                                        color: "#ffffff",
                                        fontSize: "14px",
                                        fontWeight: "bold"
                                    },
                                    icon: {
                                        url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
                                        labelOrigin: new google.maps.Point(10, -10)
                                    }
                                });
                            }
                        });
                    });
                })
                .catch(error => console.error("Error loading KML:", error));

            const toggleButton = document.getElementById("toggleButton");
            toggleButton.addEventListener("click", () => {
                labelsVisible = !labelsVisible;
                if (labelsVisible) {
                    map.setMapTypeId("hybrid");
                } else {
                    map.setMapTypeId("satellite");
                }
                toggleButton.textContent = labelsVisible ? "Hide Modern Labels" : "Show Modern Labels";
                console.log("Toggled to:", map.getMapTypeId());
            });
        }
    </script>
