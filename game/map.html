<!DOCTYPE html>
<html>
<head>
    <title>Ancient Map with Label Toggle</title>
    <style>
        /* Full-screen map */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
        }
        #map {
            height: 100%;
            width: 100%;
        }
        #toggleButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <button id="toggleButton">Show Modern Labels</button>
    <div id="map"></div>

    <script>
        let map;
        let labelsVisible = false;

        // Ancient locations
        const ancientPlaces = [
            { lat: 31.3223, lng: 46.6803, name: "Uruk" },
            { lat: 36.8463, lng: 10.3176, name: "Carthage" },
            { lat: 39.9576, lng: 26.2384, name: "Troy" }
        ];

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 35, lng: 40 },
                zoom: 5,
                mapTypeId: "satellite", // Start with pure satellite, no labels
                disableDefaultUI: true
            });

            // Add ancient placemarks
            ancientPlaces.forEach(place => {
                new google.maps.Marker({
                    position: { lat: place.lat, lng: place.lng },
                    map: map,
                    label: {
                        text: place.name,
                        color: "#ffffff",
                        fontSize: "14px",
                        fontWeight: "bold"
                    },
                    icon: {
                        url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
                        labelOrigin: new google.maps.Point(10, -10)
                    }
                });
            });

            // Toggle logic
            const toggleButton = document.getElementById("toggleButton");
            toggleButton.addEventListener("click", () => {
                labelsVisible = !labelsVisible;
                if (labelsVisible) {
                    map.setMapTypeId("hybrid"); // Satellite + full modern labels
                    map.setOptions({ styles: [] }); // No custom styles, full default hybrid
                } else {
                    map.setMapTypeId("satellite"); // Pure satellite, no labels
                    map.setOptions({ styles: [] });
                }
                toggleButton.textContent = labelsVisible ? "Hide Modern Labels" : "Show Modern Labels";
                console.log("Toggled to:", map.getMapTypeId()); // Debug
            });
        }
    </script>

    <!-- Replace with your actual key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB0siFVrQptHx6CkBJKRmC37GobNP7TfKk&callback=initMap" async defer></script>
</body>
</html>
