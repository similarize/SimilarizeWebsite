<!DOCTYPE html>
<html>
<head>
    <title>Ancient Map with Label Toggle</title>
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
        #toggleButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <button id="toggleButton">Show Modern Labels</button>
    <div id="map"></div>

    <script>
        let map;
        let labelsVisible = false;

        // Ancient locations
        const ancientPlaces = [
            { lat: 31.3223, lng: 46.6803, name: "Uruk" },
            { lat: 36.8463, lng: 10.3176, name: "Carthage" },
            { lat: 39.9576, lng: 26.2384, name: "Troy" }
        ];

        // Styles
        const noLabelsStyle = [
            { elementType: "labels", stylers: [{ visibility: "off" }] },
            { featureType: "road", stylers: [{ visibility: "off" }] },
            { featureType: "administrative", stylers: [{ visibility: "off" }] }
        ];

        const withLabelsStyle = [
            { featureType: "poi", stylers: [{ visibility: "off" }] },
            { featureType: "road", stylers: [{ visibility: "off" }] },
            { featureType: "administrative", stylers: [{ visibility: "off" }] },
            { elementType: "labels.text", stylers: [{ visibility: "on" }] }
        ];

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 35, lng: 40 },
                zoom: 5,
                mapTypeId: "satellite",
                styles: noLabelsStyle,
                disableDefaultUI: true
            });

            // Add ancient placemarks
            ancientPlaces.forEach(place => {
                new google.maps.Marker({
                    position: { lat: place.lat, lng: place.lng },
                    map: map,
                    label: {
                        text: place.name,
                        color: "#ffffff",
                        fontSize: "14px",
                        fontWeight: "bold"
                    },
                    icon: {
                        url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
                        labelOrigin: new google.maps.Point(10, -10)
                    }
                });
            });

            // Toggle logic
            const toggleButton = document.getElementById("toggleButton");
            toggleButton.addEventListener("click", () => {
                labelsVisible = !labelsVisible;
                console.log("Toggling labels:", labelsVisible); // Debug log
                map.setOptions({ styles: labelsVisible ? withLabelsStyle : noLabelsStyle });
                toggleButton.textContent = labelsVisible ? "Hide Modern Labels" : "Show Modern Labels";
            });
        }

        // Error handling for API load
        window.onload = function() {
            if (typeof google === 'undefined') {
                console.error("Google Maps API failed to load. Check your API key or internet connection.");
            }
        };
    </script>

    <!-- Replace YOUR_API_KEY with your actual key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
